name: Validate and compile synthetic profiles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile:
          - esp32-c3
          - esp32-c3-camera
          - esp32-c3-multi-camera
          - esp32-c3-one-metric
          - esp32-s3-quad-psram
          - esp32-s3-quad-psram-camera
          - esp32-s3-home-migration
          - esp32-s3-template-pages
          - esp32-s3-work-tailscale
    container:
      image: ghcr.io/esphome/esphome:2026.9.0
    steps:
      # actions/checkout v7.0.1 (Node 24), pinned to its commit rather than a moving tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check public source and package structure
        run: |
          python scripts/check_public.py
          python scripts/check_project.py
      - name: ESPHome configuration validation (synthetic values only)
        run: esphome config tests/${{ matrix.profile }}.yaml
      - name: Compile synthetic firmware (never install these fixtures)
        run: esphome compile tests/${{ matrix.profile }}.yaml
      - name: Verify Work S3 Tailscale PSRAM settings
        if: matrix.profile == 'esp32-s3-work-tailscale'
        run: |
          CFG=tests/.esphome/build/ci-work-s3-minion/sdkconfig.ci-work-s3-minion
          test -f "$CFG"
          grep -q '^CONFIG_SPIRAM_MODE_QUAD=y "$CFG"
          ! grep -q '^CONFIG_SPIRAM_MODE_OCT=y "$CFG"
          grep -q '^CONFIG_ML_H2_BUFFER_SIZE_KB=128 "$CFG"
          grep -q '^CONFIG_ML_JSON_BUFFER_SIZE_KB=128 "$CFG"
      # Deliberately no artifact upload, device secrets, or OTA deployment.
