esphome:
  on_boot:
  - priority: -90
    then:
    - script.execute: update_backlight

time:
- id: !extend sntp_time
  on_time_sync:
    then:
    - script.execute: update_backlight
  on_time:
  - seconds: 0
    minutes: /1
    then:
    - script.execute: update_backlight

binary_sensor:
- platform: homeassistant
  id: override_light
  entity_id: binary_sensor.example_override_light
  internal: true
  on_state:
    then:
    - script.execute: update_backlight

script:
- id: update_backlight
  mode: restart
  then:
  - lambda: |-
      auto now = id(sntp_time).now();
      const bool time_ok = now.is_valid();
      bool in_quiet = false;

      if (time_ok) {
        const int seconds_now =
            now.hour * 3600 + now.minute * 60 + now.second;
        constexpr int quiet_start = 23 * 3600;
        constexpr int quiet_end = 6 * 3600;
        in_quiet =
            seconds_now >= quiet_start || seconds_now < quiet_end;
      }

      const bool want_on =
          !time_ok || id(override_light).state || !in_quiet;

      if (want_on != id(lcd_backlight_switch).state) {
        if (want_on)
          id(lcd_backlight_switch).turn_on();
        else
          id(lcd_backlight_switch).turn_off();
      }

api:
  encryption:
    key: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=

ota:
- platform: esphome
  password: not-a-production-password

wifi:
  ssid: ROUND_MINIONS_CI_ONLY
  password: not-a-real-network-password
  output_power: 8.5
