# SYNTHETIC CI FIXTURE. Proves arbitrary template page counts and page types.
substitutions:
  device_name: ci-s3-template-pages
  friendly_name: CI Template Pages
  timezone: Etc/UTC
  ha_base_url: http://homeassistant.local:8123
  clock_page_duration_ms: '4000'

  # Disable the backward-compatible six-slot layer entirely.
  metric_1_enabled: 'false'
  metric_2_enabled: 'false'
  metric_3_enabled: 'false'
  metric_4_enabled: 'false'
  metric_5_enabled: 'false'
  metric_6_enabled: 'false'

packages:
  round_minion: !include
    file: ../profiles/esp32-s3-quad-psram-camera.yaml

  numeric_1: !include
    file: ../packages/page-numeric.yaml
    vars:
      page_id: numeric_1
      page_label: Metric 1
      page_entity: sensor.example_template_metric_1
      page_duration_ms: '4000'
      page_order: '10'
      page_graph_interval: 12h
      page_unit: °F
      page_suffix: °
      page_decimals: '1'
      page_panel_style: '1'
      page_color_red: 90.2%
      page_color_green: 62.4%
      page_color_blue: 0%

