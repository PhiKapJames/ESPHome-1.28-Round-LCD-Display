# SYNTHETIC CI FIXTURE. Never install on a real device.
# Six sources intentionally exceed the old four-source implementation.
substitutions:
  device_name: ci-esp32-c3-multi-camera
  friendly_name: CI Many Cameras
packages:
  round_minion: !include
    file: ../profiles/esp32-c3-camera.yaml

  driveway: !include
    file: ../packages/camera-source.yaml
    vars:
      camera_id: driveway
      camera_entity: camera.example_driveway
      camera_source_label: DRIVEWAY
      camera_status_label: driveway
      camera_button_name: Show Driveway Snapshot
      camera_trigger_person: 'true'
      camera_person_entity: binary_sensor.example_driveway_person
      camera_trigger_vehicle: 'true'
      camera_vehicle_entity: binary_sensor.example_driveway_vehicle
      camera_cooldown_ms: '60000'

  parking: !include
    file: ../packages/camera-source.yaml
    vars:
      camera_id: parking
      camera_entity: camera.example_parking
      camera_source_label: PARKING
      camera_status_label: parking
      camera_button_name: Show Parking Snapshot
      camera_trigger_person: 'false'
      camera_person_entity: binary_sensor.example_parking_person
      camera_trigger_vehicle: 'true'
      camera_vehicle_entity: binary_sensor.example_parking_vehicle
      camera_cooldown_ms: '60000'

  backyard: !include
    file: ../packages/camera-source.yaml
    vars:
      camera_id: backyard
