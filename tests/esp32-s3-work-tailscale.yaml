external_components:
- source:
    type: git
    url: https://github.com/Csontikka/esphome-tailscale.git
    ref: v0.5.12
  components: [tailscale]
  refresh: 1d

tailscale:
  auth_key: NOT_A_REAL_TAILSCALE_AUTH_KEY
  hostname: ci-work-s3-minion
  max_peers: 16
  netmap_buffer_kb: 128
  disable_telemetry: true

time:
- platform: sntp
  id: tailscale_time
  timezone: America/New_York
  servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  on_time_sync:
    then:
    - script.execute: update_backlight
  on_time:
  - seconds: 0
    minutes: /1
    then:
    - script.execute: update_backlight

esphome:
  on_boot:
  - priority: -90
    then:
    - script.execute: update_backlight

script:
- id: update_backlight
  mode: restart
  then:
  - lambda: |-
      auto now = id(tailscale_time).now();
      const bool time_ok = now.is_valid();
      bool in_quiet = false;

      if (time_ok) {
        const int seconds_now =
            now.hour * 3600 + now.minute * 60 + now.second;
        constexpr int quiet_start = 18 * 3600;
        constexpr int quiet_end = 7 * 3600;
        in_quiet =
            seconds_now >= quiet_start || seconds_now < quiet_end;
      }

      const bool want_on = !time_ok || !in_quiet;

      if (want_on != id(lcd_backlight_switch).state) {
        if (want_on)
          id(lcd_backlight_switch).turn_on();
        else
          id(lcd_backlight_switch).turn_off();
      }

binary_sensor:
- platform: tailscale
  connected:
    name: VPN Connected
    id: work_vpn_connected

text_sensor:
- platform: tailscale
  ip_address:
    name: VPN IP
    id: work_vpn_ip
  memory_mode:
    name: VPN Device Memory
    id: work_vpn_memory
  ha_connection_route:
    name: HA API Connection Route
    id: work_ha_route

api:
  encryption:
    key: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=

ota:
- platform: esphome
  password: not-a-production-password

wifi:
  ssid: ROUND_MINIONS_CI_ONLY
  password: not-a-real-network-password
  output_power: 8.5
