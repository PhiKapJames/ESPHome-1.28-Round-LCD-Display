# Optional detection-only snapshot + HA override. Runtime access token is never stored in this repository.
substitutions:
  camera_entity: camera.example_camera
  camera_image_width: '200'
  camera_image_height: '112'
  camera_hold_time: 15s
  camera_download_timeout: 20s
  camera_error_hold_time: 4s
  camera_cooldown: 60s
  camera_min_free_heap: '100000'
  camera_min_largest_block: '60000'
  ha_base_url: http://homeassistant.local:8123
  person_entity: binary_sensor.example_person
  camera_source_label: CAMERA
  camera_status_label: camera
esphome:
  on_boot:
  - priority: -99
    then:
    - lambda: !lambda |-
        id(camera_alert_status).publish_state("Idle");
logger:
  logs:
    online_image: NONE
    http_request: NONE
    http_request.idf: NONE
    homeassistant.text_sensor: NONE
    text_sensor: NONE
http_request:
  id: camera_http
  timeout: 5s
  follow_redirects: false
  verify_ssl: true
  buffer_size_rx: 1024
  buffer_size_tx: 512
image:
- platform: online_image
  id: camera_snapshot
  http_request_id: camera_http
  url: ${ha_base_url}/api/camera_proxy/${camera_entity}
  format: JPEG
  type: RGB565
  transparency: opaque
  resize: ${camera_image_width}x${camera_image_height}
  update_interval: never
  buffer_size: 4096
  request_headers:
    Cache-Control: no-cache
  on_download_finished:
    then:
    - lambda: |-
        // The callback only records completion. Do not release the image
        // or start another download inside this callback.
        if (!id(camera_alert_active) || id(camera_alert_phase) != 2)
          return;
        const int width = id(camera_snapshot).get_width();
        const int height = id(camera_snapshot).get_height();
        if (cached || width <= 0 || height <= 0 ||
            width > ${camera_image_width} ||
            height > ${camera_image_height}) {
          id(camera_alert_phase) = 4;
          id(camera_alert_status).publish_state("Failed: no fresh image");
          ESP_LOGW("camera_alert", "No valid fresh snapshot was received");
          return;
        }
        id(camera_alert_phase) = 3;
        auto now = id(sntp_time).now();
        if (now.is_valid()) {
          char stamp[20];
          int hour12 = now.hour % 12;
          if (hour12 == 0) hour12 = 12;
          snprintf(stamp, sizeof(stamp), "%d:%02d %s",
                   hour12, now.minute, now.hour >= 12 ? "PM" : "AM");
          id(camera_fetch_time) = stamp;
        } else {
          id(camera_fetch_time) = "--:--";
        }
        id(camera_alert_status).publish_state("Showing ${camera_status_label} snapshot");
        ESP_LOGI("camera_alert", "${camera_status_label} ready: %dx%d; free heap=%u, largest=%u",
                 width, height,
                 (unsigned) heap_caps_get_free_size(MALLOC_CAP_8BIT),
                 (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_8BIT));
  on_error:
    then:
    - lambda: |-
        if (!id(camera_alert_active) || id(camera_alert_phase) != 2)
          return;
        id(camera_alert_phase) = 4;
        id(camera_alert_status).publish_state("Failed: HTTP/auth/JPEG/memory");
        ESP_LOGW("camera_alert", "Snapshot failed; check HA address, camera, and free RAM");
text_sensor:
- platform: homeassistant
  id: camera_picture_path
  entity_id: ${camera_entity}
  attribute: entity_picture
  internal: true
- platform: template
  id: camera_alert_status
  name: Camera Alert Status
  entity_category: diagnostic
  update_interval: never
binary_sensor:
- platform: homeassistant
  id: camera_person_detected
  entity_id: ${person_entity}
  internal: true
  trigger_on_initial_state: false
  on_press:
    then:
    - script.execute:
        id: camera_alert
        override_request: false
button:
- platform: template
  id: show_camera_snapshot
  name: Show Camera Snapshot
  icon: mdi:camera
  entity_category: ''
  on_press:
    then:
    - script.execute:
        id: camera_alert
        override_request: true
globals:
- id: camera_alert_phase
  type: int
  restore_value: false
  initial_value: '0'
- id: camera_alert_is_override
  type: bool
  restore_value: false
  initial_value: 'false'
- id: camera_fetch_time
  type: std::string
  restore_value: false
  initial_value: '"--:--"'
script:
- id: camera_alert_cooldown
  mode: restart
  then:
  - delay: ${camera_cooldown}
- id: camera_alert
  mode: single
  parameters:
    override_request: bool
  then:
  - if:
      condition:
        lambda: |-
          if (!id(display_initialized) || id(camera_alert_active))
            return false;
          if (!override_request && (!id(camera_alerts_enabled).state ||
              id(camera_alert_cooldown).is_running()))
            return false;
          return true;
      then:
      - lambda: |-
          const uint32_t elapsed = millis() - id(normal_started_ms);
          id(normal_remaining_ms) =
              elapsed < id(normal_remaining_ms)
              ? id(normal_remaining_ms) - elapsed : 1;
          id(rotation_resume_pending) = true;
          id(camera_alert_active) = true;
          id(camera_alert_is_override) = override_request;
          id(camera_alert_phase) = 1;
          id(camera_fetch_time) = "--:--";
          id(camera_alert_status).publish_state("Waiting for HA camera path");
          ESP_LOGI("camera_alert", "%s; pausing normal display",
                   override_request ? "Camera snapshot requested" : "Person detected");
      - script.stop: display_rotation
      - online_image.release: camera_snapshot
      - display.page.show: page_camera_alert
      - component.update: main_display
      - wait_until:
          condition:
            lambda: |-
              return id(camera_picture_path).has_state() &&
                     !id(camera_picture_path).state.empty() &&
                     id(camera_picture_path).state != "unknown" &&
                     id(camera_picture_path).state != "unavailable";
          timeout: 3s
      - lambda: |-
          std::string path = id(camera_picture_path).state;
          const std::string expected = "/api/camera_proxy/${camera_entity}";
          std::string base = "${ha_base_url}";
          while (!base.empty() && base.back() == '/') base.pop_back();

          // An absolute entity_picture is accepted only if it points at
          // the configured HA origin. Never send its token elsewhere.
          if (path.compare(0, base.size() + 1, base + "/") == 0)
            path.erase(0, base.size());
          const auto question = path.find('?');
          if (base.empty() ||
              (base.compare(0, 7, "http://") != 0 &&
               base.compare(0, 8, "https://") != 0) ||
              question == std::string::npos ||
              path.substr(0, question) != expected) {
            id(camera_alert_phase) = 7;
            id(camera_alert_status).publish_state("Failed: HA camera path missing");
            ESP_LOGW("camera_alert", "Missing or unexpected HA camera path");
            return;
          }

          // Extract the current token, retaining no unrelated URL params.
          auto token_pos = path.find("?token=");
          if (token_pos == std::string::npos)
            token_pos = path.find("&token=");
          std::string token;
          if (token_pos != std::string::npos) {
            token_pos += 7;
            const auto token_end = path.find_first_of("&#", token_pos);
            token = path.substr(token_pos, token_end - token_pos);
          }
          bool token_ok = !token.empty() && token.size() <= 128;
          for (char c : token) {
            if (!((c >= '0' && c <= '9') ||
                  (c >= 'a' && c <= 'f') ||
                  (c >= 'A' && c <= 'F'))) token_ok = false;
          }
          if (!token_ok) {
            id(camera_alert_phase) = 7;
            id(camera_alert_status).publish_state("Failed: camera token missing");
            ESP_LOGW("camera_alert", "No usable HA camera token");
            return;
          }

          const size_t free_heap = heap_caps_get_free_size(MALLOC_CAP_8BIT);
          const size_t largest = heap_caps_get_largest_free_block(MALLOC_CAP_8BIT);
          ESP_LOGI("camera_alert", "Preflight free heap=%u, largest=%u",
                   (unsigned) free_heap, (unsigned) largest);
          if (free_heap < ${camera_min_free_heap} ||
              largest < ${camera_min_largest_block}) {
            id(camera_alert_phase) = 6;
            id(camera_alert_status).publish_state("Skipped image: low free RAM");
            ESP_LOGW("camera_alert", "RAM guard: showing a text-only alert");
            return;
          }

          // Ask HA to reduce the JPEG too. ESPHome resize bounds the
          // decoded image, but HA may only approximately scale its JPEG.
          const std::string url = base + expected + "?token=" + token +
              "&width=${camera_image_width}&height=${camera_image_height}" +
              "&_esphome=" + std::to_string(millis());
          id(camera_snapshot).set_url(url); // Does not download by itself.
          id(camera_alert_phase) = 2;
          id(camera_alert_status).publish_state("Downloading ${camera_status_label} snapshot");
      - if:
          condition:
            lambda: return id(camera_alert_phase) == 2;
          then:
          - component.update: camera_snapshot
          - wait_until:
              condition:
                lambda: return id(camera_alert_phase) != 2;
              timeout: ${camera_download_timeout}
          - if:
              condition:
                lambda: return id(camera_alert_phase) == 2;
              then:
              - lambda: |-
                  id(camera_alert_phase) = 5;
                  id(camera_alert_status).publish_state("Failed: download timeout");
                  ESP_LOGW("camera_alert", "Snapshot timed out");
      - if:
          condition:
            lambda: return id(camera_alert_phase) != 3;
          then:
          - online_image.release: camera_snapshot
      - component.update: main_display
      - if:
          condition:
            lambda: return id(camera_alert_phase) == 3;
          then:
          - delay: ${camera_hold_time}
          else:
          - delay: ${camera_error_hold_time}
      - lambda: |-
          const bool success = id(camera_alert_phase) == 3;
          id(camera_alert_active) = false;
          id(camera_alert_phase) = 0;
          if (success)
            id(camera_alert_status).publish_state("Idle: last snapshot succeeded");
          // On failure leave the diagnostic reason visible in HA.
      - online_image.release: camera_snapshot
      - lambda: |-
          // Drop the token-bearing request URL. Native attribute updates
          // will supply the current token for the next accepted detection.
          id(camera_snapshot).set_url(
              "${ha_base_url}/api/camera_proxy/${camera_entity}");
          ESP_LOGI("camera_alert", "Alert ended; free heap=%u, largest=%u",
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_8BIT),
                   (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_8BIT));
      - script.execute: camera_alert_cooldown
      - script.execute: display_rotation
switch:
- platform: template
  id: camera_alerts_enabled
  name: Camera Alerts
  entity_category: config
  optimistic: true
  restore_mode: RESTORE_DEFAULT_ON
display:
- id: main_display
  pages:
  - id: page_camera_alert
    lambda: |-
      it.fill(Color::BLACK);

      const int source_width = id(camera_snapshot).get_width();
      const int source_height = id(camera_snapshot).get_height();

      if (id(camera_alert_active) && id(camera_alert_phase) == 3 &&
          source_width > 0 && source_height > 0) {
        // Center-crop a square from the decoded landscape snapshot.
        // The existing 200x112 maximum is deliberately unchanged:
        // render larger without allocating a second/full-size image.
        // The square fills all 240x240 pixels; the round LCD masks corners.
        constexpr int SCREEN_SIZE = 240;
        const int crop_size =
            source_width < source_height ? source_width : source_height;
        const int crop_x = (source_width - crop_size) / 2;
        const int crop_y = (source_height - crop_size) / 2;

        // Pixel-center nearest-neighbor mapping. This small lookup table
        // uses 480 bytes on the stack, not a new image/framebuffer.
        uint16_t source_index[SCREEN_SIZE];
        for (int i = 0; i < SCREEN_SIZE; i++) {
          source_index[i] = static_cast<uint16_t>(
              ((2 * i + 1) * crop_size) / (2 * SCREEN_SIZE));
        }

        // Adjacent output pixels often use the same source pixel.
        // Draw each repeated block once instead of fetching it repeatedly.
        // No persistent state: safe when the MIPI driver calls this lambda
        // more than once for its existing 50% framebuffer.
        for (int y = 0; y < SCREEN_SIZE; ) {
          const int sy = source_index[y];
          int next_y = y + 1;
          while (next_y < SCREEN_SIZE && source_index[next_y] == sy)
            next_y++;

          for (int x = 0; x < SCREEN_SIZE; ) {
            const int sx = source_index[x];
            int next_x = x + 1;
            while (next_x < SCREEN_SIZE && source_index[next_x] == sx)
              next_x++;

            const Color pixel =
                id(camera_snapshot).get_pixel(crop_x + sx, crop_y + sy);
            it.filled_rectangle(x, y, next_x - x, next_y - y, pixel);
            x = next_x;
          }
          y = next_y;
        }

        // Deliberately no title, frame, timestamp, footer, or page dots
        // over a successfully loaded camera snapshot.
        return;
      }

      // Keep the existing loading/error feedback until an image is ready.
      const Color alert_color(255, 182, 0);
      it.filled_ring(120, 120, 116, 113, alert_color);
      it.print(120, 58, id(title_font), alert_color,
               TextAlign::BASELINE_CENTER,
               id(camera_alert_is_override) ? "Camera" : "Person");

      const char *line1 = "Loading";
      const char *line2 = "snapshot";
      if (id(camera_alert_phase) == 4) {
        line1 = "No image"; line2 = "Check HA";
      } else if (id(camera_alert_phase) == 5) {
        line1 = "Timed out"; line2 = "No image";
      } else if (id(camera_alert_phase) == 6) {
        line1 = "Low RAM"; line2 = "No image";
      } else if (id(camera_alert_phase) == 7) {
        line1 = "No source"; line2 = "Check HA";
      }
      it.print(120, 119, id(time_font), Color::WHITE,
               TextAlign::BASELINE_CENTER, line1);
      it.print(120, 161, id(time_font), Color::WHITE,
               TextAlign::BASELINE_CENTER, line2);
      it.print(120, 210, id(camera_meta_font), alert_color,
               TextAlign::BASELINE_CENTER, "${camera_source_label}");
font:
- id: camera_meta_font
  file: gfonts://Roboto
  size: 22
  glyphs: ' /0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'
