# Shared alert-only camera engine.
# Camera sources are separate reusable package instances; this engine has no source-count limit.
substitutions:
  camera_image_width: '200'
  camera_image_height: '112'
  camera_hold_time: 15s
  camera_download_timeout: 20s
  camera_error_hold_time: 4s
  camera_queue_expire_ms: '60000'
  camera_queue_max_runs: '20'
  camera_min_free_heap: '100000'
  camera_min_largest_block: '60000'
  ha_base_url: http://homeassistant.local:8123

esphome:
  on_boot:
  - priority: -99
    then:
    - lambda: |-
        id(camera_alert_status).publish_state("Idle");
        id(last_camera_alert).publish_state("None");

logger:
  logs:
    # entity_picture contains a rotating access token. Keep URL-bearing logs muted.
    online_image: NONE
    http_request: NONE
    http_request.idf: NONE
    homeassistant.text_sensor: NONE
    text_sensor: NONE

http_request:
  id: camera_http
  timeout: 5s
  follow_redirects: false
  verify_ssl: true
  buffer_size_rx: 1024
  buffer_size_tx: 512

image:
- platform: online_image
  id: camera_snapshot
  http_request_id: camera_http
  # Placeholder only. A queued source request replaces this before download.
  url: ${ha_base_url}/api/camera_proxy/camera.round_minion_placeholder
  format: JPEG
  type: RGB565
  transparency: opaque
  resize: ${camera_image_width}x${camera_image_height}
  update_interval: never
  buffer_size: 4096
  request_headers:
    Cache-Control: no-cache
  on_download_finished:
    then:
    - lambda: |-
        if (!id(camera_alert_active) || id(camera_alert_phase) != 2)
          return;

        const int width = id(camera_snapshot).get_width();
        const int height = id(camera_snapshot).get_height();
        if (cached || width <= 0 || height <= 0 ||
            width > ${camera_image_width} ||
            height > ${camera_image_height}) {
          id(camera_alert_phase) = 4;
          id(camera_alert_status).publish_state("Failed: no fresh image");
          ESP_LOGW("camera_alert", "No valid fresh snapshot was received");
          return;
        }

        id(camera_alert_phase) = 3;
        id(camera_alert_status).publish_state(
            "Showing " + id(camera_active_status_label) + " snapshot");
        ESP_LOGI("camera_alert", "%s ready: %dx%d; free heap=%u, largest=%u",
                 id(camera_active_status_label).c_str(), width, height,
                 (unsigned) heap_caps_get_free_size(MALLOC_CAP_8BIT),
                 (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_8BIT));
  on_error:
    then:
    - lambda: |-
        if (!id(camera_alert_active) || id(camera_alert_phase) != 2)
          return;
        id(camera_alert_phase) = 4;
        id(camera_alert_status).publish_state("Failed: HTTP/auth/JPEG/memory");
        ESP_LOGW("camera_alert", "Snapshot failed; check HA address, camera, and free RAM");

text_sensor:
- platform: template
  id: camera_alert_status
  internal: true
  update_interval: never
- platform: template
  id: last_camera_alert
  name: Last Camera Alert
  icon: mdi:cctv
  entity_category: diagnostic
  update_interval: never

globals:
- id: camera_alert_phase
  type: int
  restore_value: false
  initial_value: '0'
- id: camera_alert_trigger_code
  type: int
  restore_value: false
  initial_value: '0'
- id: camera_alert_is_override
  type: bool
  restore_value: false
  initial_value: 'false'
- id: camera_active_entity
  type: std::string
  restore_value: false
  initial_value: '""'
- id: camera_active_source_label
  type: std::string
  restore_value: false
  initial_value: '""'
- id: camera_active_status_label
  type: std::string
  restore_value: false
  initial_value: '""'

script:
- id: camera_alert
  # The queue is bounded to protect RAM, but camera source count is not hard-coded.
  # Each queued run contains only small strings/integers; JPEG decoding remains singular.
  mode: queued
  max_runs: ${camera_queue_max_runs}
  parameters:
    source_entity: string
    source_label: string
    status_label: string
    picture_path: string
    trigger_code: int
    override_request: bool
    requested_ms: int
  then:
  - if:
      condition:
        lambda: |-
          if (!id(display_initialized) || id(camera_alert_active))
            return false;

          if (!override_request) {
            const uint32_t age =
                millis() - static_cast<uint32_t>(requested_ms);
            if (age > ${camera_queue_expire_ms}) {
              ESP_LOGI("camera_alert",
                       "Dropping stale queued camera request (%u ms old)",
                       (unsigned) age);
              return false;
            }
          }
          return true;
      then:
      - lambda: |-
          const uint32_t elapsed = millis() - id(normal_started_ms);
          id(normal_remaining_ms) =
              elapsed < id(normal_remaining_ms)
              ? id(normal_remaining_ms) - elapsed : 1;
          id(rotation_resume_pending) = true;

          const int rotation_index = id(active_rotation_index);
          if (!id(normal_is_clock) &&
              rotation_index >= 0 &&
              static_cast<size_t>(rotation_index) < id(rotation_exit_callbacks).size() &&
              id(rotation_exit_callbacks)[rotation_index]) {
            id(rotation_exit_callbacks)[rotation_index]();
          }

          id(camera_alert_active) = true;
          id(camera_alert_trigger_code) = trigger_code;
          id(camera_alert_is_override) = override_request;
          id(camera_alert_phase) = 1;
          id(camera_active_entity) = source_entity;
          id(camera_active_source_label) = source_label;
          id(camera_active_status_label) = status_label;

          const char *reason = override_request ? "Camera snapshot requested" :
                               (trigger_code == 2 ? "Vehicle detected" : "Person detected");
          if (!override_request) {
            const std::string kind =
                trigger_code == 2 ? "Vehicle" : "Person";
            id(last_camera_alert).publish_state(source_label + ": " + kind);
          }
          id(camera_alert_status).publish_state("Preparing " + status_label + " snapshot");
          ESP_LOGI("camera_alert", "%s for %s; pausing normal display",
                   reason, status_label.c_str());

      - script.stop: display_rotation
      - online_image.release: camera_snapshot
      - display.page.show: page_camera_alert
      - component.update: main_display

      - lambda: |-
          std::string path = picture_path;
          const std::string expected =
              "/api/camera_proxy/" + source_entity;
          std::string base = "${ha_base_url}";
          while (!base.empty() && base.back() == '/') base.pop_back();

          // An absolute entity_picture is accepted only for the configured HA origin.
          if (path.compare(0, base.size() + 1, base + "/") == 0)
            path.erase(0, base.size());

          const auto question = path.find('?');
          if (base.empty() ||
              (base.compare(0, 7, "http://") != 0 &&
               base.compare(0, 8, "https://") != 0) ||
              question == std::string::npos ||
              path.substr(0, question) != expected) {
            id(camera_alert_phase) = 7;
            id(camera_alert_status).publish_state("Failed: HA camera path missing");
            ESP_LOGW("camera_alert", "Missing or unexpected HA camera path");
            return;
          }

          auto token_pos = path.find("?token=");
          if (token_pos == std::string::npos)
            token_pos = path.find("&token=");

          std::string token;
          if (token_pos != std::string::npos) {
            token_pos += 7;
            const auto token_end = path.find_first_of("&#", token_pos);
            token = path.substr(token_pos, token_end - token_pos);
          }

          bool token_ok = !token.empty() && token.size() <= 128;
          for (char c : token) {
            if (!((c >= '0' && c <= '9') ||
                  (c >= 'a' && c <= 'f') ||
                  (c >= 'A' && c <= 'F')))
              token_ok = false;
          }
          if (!token_ok) {
            id(camera_alert_phase) = 7;
            id(camera_alert_status).publish_state("Failed: camera token missing");
            ESP_LOGW("camera_alert", "No usable HA camera token");
            return;
          }

          const size_t free_heap = heap_caps_get_free_size(MALLOC_CAP_8BIT);
          const size_t largest =
              heap_caps_get_largest_free_block(MALLOC_CAP_8BIT);
          ESP_LOGI("camera_alert", "Preflight %s free heap=%u, largest=%u",
                   status_label.c_str(),
                   (unsigned) free_heap, (unsigned) largest);

          if (free_heap < ${camera_min_free_heap} ||
              largest < ${camera_min_largest_block}) {
            id(camera_alert_phase) = 6;
            id(camera_alert_status).publish_state("Skipped image: low free RAM");
            ESP_LOGW("camera_alert", "RAM guard: showing a text-only alert");
            return;
          }

          const std::string url = base + expected + "?token=" + token +
              "&width=${camera_image_width}&height=${camera_image_height}" +
              "&_esphome=" + std::to_string(millis());
          id(camera_snapshot).set_url(url);
          id(camera_alert_phase) = 2;
          id(camera_alert_status).publish_state(
              "Downloading " + status_label + " snapshot");

      - if:
          condition:
            lambda: return id(camera_alert_phase) == 2;
          then:
          - component.update: camera_snapshot
          - wait_until:
              condition:
                lambda: return id(camera_alert_phase) != 2;
              timeout: ${camera_download_timeout}
          - if:
              condition:
                lambda: return id(camera_alert_phase) == 2;
              then:
              - lambda: |-
                  id(camera_alert_phase) = 5;
                  id(camera_alert_status).publish_state("Failed: download timeout");
                  ESP_LOGW("camera_alert", "Snapshot timed out");

      - if:
          condition:
            lambda: return id(camera_alert_phase) != 3;
          then:
          - online_image.release: camera_snapshot

      - component.update: main_display

      - if:
          condition:
            lambda: return id(camera_alert_phase) == 3;
          then:
          - delay: ${camera_hold_time}
          else:
          - delay: ${camera_error_hold_time}

      - lambda: |-
          const bool success = id(camera_alert_phase) == 3;
          id(camera_alert_active) = false;
          id(camera_alert_phase) = 0;
          if (success)
            id(camera_alert_status).publish_state("Idle: last snapshot succeeded");

      - online_image.release: camera_snapshot

      - lambda: |-
          // Do not retain a token-bearing URL after the request completes.
          id(camera_snapshot).set_url(
              "${ha_base_url}/api/camera_proxy/camera.round_minion_placeholder");

          // If another camera request is queued, this timestamp prevents it from
          // subtracting the time spent on the previous alert from the normal page.
          id(normal_started_ms) = millis();

          ESP_LOGI("camera_alert", "Alert ended for %s; free heap=%u, largest=%u",
                   id(camera_active_status_label).c_str(),
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_8BIT),
                   (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_8BIT));

      - script.execute: display_rotation


display:
- id: !extend main_display
  pages:
  - id: page_camera_alert
    lambda: |-
      it.fill(Color::BLACK);

      const int source_width = id(camera_snapshot).get_width();
      const int source_height = id(camera_snapshot).get_height();

      if (id(camera_alert_active) && id(camera_alert_phase) == 3 &&
          source_width > 0 && source_height > 0) {
        constexpr int SCREEN_SIZE = 240;
        const int crop_size =
            source_width < source_height ? source_width : source_height;
        const int crop_x = (source_width - crop_size) / 2;
        const int crop_y = (source_height - crop_size) / 2;

        uint16_t source_index[SCREEN_SIZE];
        for (int i = 0; i < SCREEN_SIZE; i++) {
          source_index[i] = static_cast<uint16_t>(
              ((2 * i + 1) * crop_size) / (2 * SCREEN_SIZE));
        }

        for (int y = 0; y < SCREEN_SIZE; ) {
          const int sy = source_index[y];
          int next_y = y + 1;
          while (next_y < SCREEN_SIZE && source_index[next_y] == sy)
            next_y++;

          for (int x = 0; x < SCREEN_SIZE; ) {
            const int sx = source_index[x];
            int next_x = x + 1;
            while (next_x < SCREEN_SIZE && source_index[next_x] == sx)
              next_x++;

            const Color pixel =
                id(camera_snapshot).get_pixel(crop_x + sx, crop_y + sy);
            it.filled_rectangle(x, y, next_x - x, next_y - y, pixel);
            x = next_x;
          }
          y = next_y;
        }
        return;
      }

      const Color alert_color(255, 182, 0);
      it.filled_ring(120, 120, 116, 113, alert_color);

      const char *heading = id(camera_alert_is_override) ? "Camera" :
                            (id(camera_alert_trigger_code) == 2 ? "Vehicle" : "Person");
      it.print(120, 58, id(title_font), alert_color,
               TextAlign::BASELINE_CENTER, heading);

      const char *line1 = "Loading";
      const char *line2 = "snapshot";
      if (id(camera_alert_phase) == 4) {
        line1 = "No image"; line2 = "Check HA";
      } else if (id(camera_alert_phase) == 5) {
        line1 = "Timed out"; line2 = "No image";
      } else if (id(camera_alert_phase) == 6) {
        line1 = "Low RAM"; line2 = "No image";
      } else if (id(camera_alert_phase) == 7) {
        line1 = "No source"; line2 = "Check HA";
      }

      it.print(120, 119, id(time_font), Color::WHITE,
               TextAlign::BASELINE_CENTER, line1);
      it.print(120, 161, id(time_font), Color::WHITE,
               TextAlign::BASELINE_CENTER, line2);
      it.print(120, 210, id(camera_meta_font), alert_color,
               TextAlign::BASELINE_CENTER,
               id(camera_active_source_label).c_str());

font:
- id: camera_meta_font
  file: gfonts://Roboto
  size: 22
  glyphs: ' -_/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'
