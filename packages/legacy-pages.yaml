# Backward-compatibility layer for the original metric_1..metric_6 substitutions.
# New configurations may disable all legacy slots and instantiate page templates directly.
substitutions:
  _legacy_1: !include
    file: page-numeric.yaml
    vars:
      page_id: legacy_1
      page_label: ${metric_1_label}
      page_entity: ${metric_1_entity}
      page_duration_ms: ${metric_1_duration_ms}
      page_order: '10'
      page_graph_interval: ${graph_interval}
      page_unit: ${metric_1_unit}
      page_suffix: ${metric_1_suffix}
      page_decimals: ${metric_1_decimals}
      page_panel_style: ${metric_panel_style}
      page_color_red: 90.2%
      page_color_green: 62.4%
      page_color_blue: 0%
  _legacy_2: !include
    file: page-numeric.yaml
    vars:
      page_id: legacy_2
      page_label: ${metric_2_label}
      page_entity: ${metric_2_entity}
      page_duration_ms: ${metric_2_duration_ms}
      page_order: '20'
      page_graph_interval: ${graph_interval}
      page_unit: ${metric_2_unit}
      page_suffix: ${metric_2_suffix}
      page_decimals: ${metric_2_decimals}
      page_panel_style: ${metric_panel_style}
      page_color_red: 33.7%
      page_color_green: 70.6%
      page_color_blue: 91.4%
  _legacy_3: !include
    file: page-numeric.yaml
    vars:
      page_id: legacy_3
      page_label: ${metric_3_label}
      page_entity: ${metric_3_entity}
      page_duration_ms: ${metric_3_duration_ms}
      page_order: '30'
      page_graph_interval: ${graph_interval}
      page_unit: ${metric_3_unit}
      page_suffix: ${metric_3_suffix}
      page_decimals: ${metric_3_decimals}
      page_panel_style: ${metric_panel_style}
      page_color_red: 0%
      page_color_green: 62.0%
      page_color_blue: 45.1%
  _legacy_4: !include
    file: page-numeric.yaml
    vars:
      page_id: legacy_4
      page_label: ${metric_4_label}
      page_entity: ${metric_4_entity}
      page_duration_ms: ${metric_4_duration_ms}
      page_order: '40'
      page_graph_interval: ${graph_interval}
      page_unit: ${metric_4_unit}
      page_suffix: ${metric_4_suffix}
      page_decimals: ${metric_4_decimals}
      page_panel_style: ${metric_panel_style}
      page_color_red: 94.1%
      page_color_green: 89.4%
      page_color_blue: 25.9%
  _legacy_5: !include
    file: page-numeric.yaml
    vars:
      page_id: legacy_5
      page_label: ${metric_5_label}
      page_entity: ${metric_5_entity}
      page_duration_ms: ${metric_5_duration_ms}
      page_order: '50'
      page_graph_interval: ${graph_interval}
      page_unit: ${metric_5_unit}
      page_suffix: ${metric_5_suffix}
      page_decimals: ${metric_5_decimals}
      page_panel_style: ${metric_panel_style}
      page_color_red: 80.0%
      page_color_green: 47.5%
      page_color_blue: 65.5%
  _legacy_6: !include
    file: page-battery.yaml
    vars:
      page_id: legacy_battery
      page_label: ${metric_6_label}
      page_entity: ${metric_6_entity}
      page_duration_ms: ${metric_6_duration_ms}
      page_order: '60'
      page_graph_interval: ${graph_interval}

  _legacy_unused: !include
    file: page-unused.yaml

packages:
  legacy_1: ${ _legacy_1 if metric_1_enabled | string | lower == 'true' else _legacy_unused }
  legacy_2: ${ _legacy_2 if metric_2_enabled | string | lower == 'true' else _legacy_unused }
  legacy_3: ${ _legacy_3 if metric_3_enabled | string | lower == 'true' else _legacy_unused }
  legacy_4: ${ _legacy_4 if metric_4_enabled | string | lower == 'true' else _legacy_unused }
  legacy_5: ${ _legacy_5 if metric_5_enabled | string | lower == 'true' else _legacy_unused }
  legacy_6: ${ _legacy_6 if metric_6_enabled | string | lower == 'true' else _legacy_unused }
