# Configurable clock renderer.
# clock_face_style: original | classic_analog | modern_dashboard | clean_arc | weather_station

substitutions:
  _clock_weather_source: !include
    file: clock-weather-source.yaml
    vars:
      clock_weather_entity: ${clock_weather_entity}
  _clock_weather_unused: !include
    file: clock-weather-unused.yaml

packages:
  weather_source: ${ _clock_weather_source if clock_face_style | string | lower == 'weather_station' else _clock_weather_unused }

globals:
- id: clock_weather_condition_value
  type: std::string
  restore_value: false
  initial_value: '"unknown"'
- id: clock_weather_temperature_unit_value
  type: std::string
  restore_value: false
  initial_value: '"°"'
- id: clock_weather_temperature_value
  type: float
  restore_value: false
  initial_value: 'NAN'
- id: clock_weather_humidity_value
  type: float
  restore_value: false
  initial_value: 'NAN'

display:
- id: !extend main_display
  pages:
  - id: page_clock
    lambda: |-
      auto now = id(sntp_time).now();

      char hour_text[4] = "--";
      char minute_text[4] = "--";
      char digital_time[12] = "--:--";
      char date_text[20] = "--- --";
      char ampm_text[4] = "--";

      if (now.is_valid()) {
        int hour12 = now.hour % 12;
        if (hour12 == 0) hour12 = 12;
        snprintf(hour_text, sizeof(hour_text), "%02d", hour12);
        snprintf(minute_text, sizeof(minute_text), "%02d", now.minute);
        snprintf(digital_time, sizeof(digital_time), "%d:%02d", hour12, now.minute);
        snprintf(ampm_text, sizeof(ampm_text), "%s", now.hour >= 12 ? "PM" : "AM");

        static const char *WEEKDAYS[] = {
          "", "SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"
        };
        const int dow = now.day_of_week >= 1 && now.day_of_week <= 7
                            ? now.day_of_week
                            : 0;
        snprintf(date_text, sizeof(date_text), "%s %02d",
                 WEEKDAYS[dow], now.day_of_month);
      }

      const Color background = Color::BLACK;
      const Color cyan = id(color_clock_ring_outer);
      const Color blue = id(color_clock_ring_inner);
      const Color purple = id(color_clock_accent);
      const Color white = Color::WHITE;
      const Color gray(92, 92, 105);
      const Color dim_gray(48, 48, 58);
      const Color red(245, 45, 45);
      const Color green(20, 230, 90);
      const Color yellow(255, 190, 20);

      // 60 points around the face, starting at 12 o'clock.
      // Shared by minute markers and analog hand geometry.
      static constexpr int MINUTE_MARKER_POINTS[][2] = {
        {120,7},{132,8},{143,9},{155,13},{166,17},{177,22},{186,29},
        {196,36},{204,44},{211,54},{218,64},{223,74},{227,85},{231,97},
        {232,108},{233,120},{232,132},{231,143},{227,155},{223,166},
        {218,176},{211,186},{204,196},{196,204},{186,211},{177,218},
        {166,223},{155,227},{143,231},{132,232},{120,233},{108,232},
        {97,231},{85,227},{74,223},{64,218},{54,211},{44,204},{36,196},
        {29,186},{22,176},{17,166},{13,155},{9,143},{8,132},{7,120},
        {8,108},{9,97},{13,85},{17,74},{22,63},{29,54},{36,44},
        {44,36},{54,29},{63,22},{74,17},{85,13},{97,9},{108,8}
      };

      auto draw_centered = [&](int x, int center_y, font::Font *f,
                               Color color, const char *text) {
        const int baseline = center_y + f->get_capheight() / 2;
        it.print(x, baseline, f, color, TextAlign::BASELINE_CENTER, text);
      };

      auto scaled_point = [&](int index, float scale, int &x, int &y) {
        const auto &p = MINUTE_MARKER_POINTS[index % 60];
        x = 120 + static_cast<int>((p[0] - 120) * scale);
        y = 120 + static_cast<int>((p[1] - 120) * scale);
      };

      auto draw_hand = [&](int index, float scale, Color color, int width) {
        int x, y;
        scaled_point(index, scale, x, y);
        for (int offset = -(width / 2); offset <= width / 2; offset++) {
          it.line(120 + offset, 120, x + offset, y, color);
          if (offset != 0)
            it.line(120, 120 + offset, x, y + offset, color);
        }
      };

      const std::string clock_style = "${clock_face_style}";

      // -------------------------------------------------------------------
      // ORIGINAL — established nested-ring face, preserved as the default.
      // -------------------------------------------------------------------
      if (clock_style == "original") {
        static constexpr int CLOCK_ORBIT_POINTS[][2] = {
          {33,59},{35,56},{38,53},{40,50},{42,48},{45,45},{48,42},
          {50,40},{53,38},{56,35},{59,33},{62,31},{65,29},{69,27},
          {72,26},{75,24},{79,22},{82,21},{85,20},{89,19},{93,18},
          {207,181},{205,184},{202,187},{200,190},{198,192},{195,195},
          {192,198},{190,200},{187,202},{184,205},{181,207},{178,209},
          {175,211},{171,213},{168,214},{165,216},{161,218},{158,219},
          {155,220},{151,221},{147,222}
        };

        it.fill(background);
        it.filled_ring(120, 120, 115, 112, cyan);
        it.circle(120, 120, 96, blue);
        it.circle(120, 120, 95, blue);
        it.circle(120, 120, 78, blue);

        for (const auto &point : CLOCK_ORBIT_POINTS)
          it.filled_circle(point[0], point[1], 2, purple);

        it.filled_circle(42, 120, 6, purple);
        it.filled_circle(198, 120, 6, purple);
        it.filled_circle(120, 16, 4, cyan);
        it.filled_circle(120, 224, 4, cyan);

        auto draw_clock_field = [&](font::Font *f, const char *text,
                                    int center_y, bool upper) {
          const int cap = f->get_capheight();
          int baseline = center_y + cap / 2;
          if (upper && baseline > 110) baseline = 110;
          if (!upper && baseline - cap < 130) baseline = 130 + cap;

          int width, offset, measured_baseline, height;
          f->measure(text, &width, &offset, &measured_baseline, &height);
          it.filled_rectangle(120 - width / 2 - 5, baseline - cap - 4,
                              width + 10, cap + 9, background);
          it.print(122, baseline + 2, f, blue,
                   TextAlign::BASELINE_CENTER, text);
          it.print(120, baseline, f, white,
                   TextAlign::BASELINE_CENTER, text);
        };

        draw_clock_field(id(clock_hour_font), hour_text, 70, true);
        draw_clock_field(id(clock_minute_font), minute_text, 170, false);

        it.filled_rectangle(77, 119, 86, 3, purple);
        it.filled_circle(77, 120, 3, purple);
        it.filled_circle(163, 120, 3, purple);
        it.filled_circle(108, 120, 3, cyan);
        it.filled_circle(120, 120, 5, cyan);
        it.filled_circle(132, 120, 3, cyan);
        it.filled_circle(120, 120, 2, purple);

        if (now.is_valid()) {
          const auto &marker = MINUTE_MARKER_POINTS[now.minute % 60];
          it.filled_circle(marker[0], marker[1], 4, white);
        }
        return;
      }

      // -------------------------------------------------------------------
      // CLASSIC ANALOG — traditional 12/3/6/9 face with hour/minute hands.
      // -------------------------------------------------------------------
      if (clock_style == "classic_analog") {
        it.fill(background);
        it.circle(120, 120, 116, dim_gray);

        for (int i = 0; i < 60; i++) {
          const auto &p = MINUTE_MARKER_POINTS[i];
          if (i % 5 == 0)
            it.filled_circle(p[0], p[1], 3, cyan);
          else
            it.filled_circle(p[0], p[1], 1, gray);
        }

        draw_centered(120, 30, id(clock_cardinal_font), white, "12");
        draw_centered(207, 120, id(clock_cardinal_font), white, "3");
        draw_centered(120, 210, id(clock_cardinal_font), white, "6");
        draw_centered(33, 120, id(clock_cardinal_font), white, "9");

        if (now.is_valid()) {
          const int minute_index = now.minute % 60;
          const int hour_index = ((now.hour % 12) * 5 + now.minute / 12) % 60;
          draw_hand(hour_index, 0.54f, white, 5);
          draw_hand(minute_index, 0.68f, white, 3);
          it.filled_circle(120, 120, 7, white);
          it.filled_circle(120, 120, 3, cyan);
          draw_centered(120, 165, id(clock_small_font), white, ampm_text);
        }

        return;
      }

      // -------------------------------------------------------------------
      // MODERN DASHBOARD — smartwatch-style minute ring with clean center.
      // -------------------------------------------------------------------
      if (clock_style == "modern_dashboard") {
        it.fill(background);
        it.filled_ring(120, 120, 115, 107, dim_gray);

        const int progress = now.is_valid() ? now.minute : 0;
        for (int i = 0; i < 60; i++) {
          const auto &p = MINUTE_MARKER_POINTS[i];
          const bool active = i <= progress;
          if (active)
            it.filled_circle(p[0], p[1], i % 5 == 0 ? 5 : 3, purple);
          else if (i % 5 == 0)
            it.filled_circle(p[0], p[1], 2, gray);
        }

        draw_centered(120, 101, id(clock_modern_time_font), white, digital_time);
        draw_centered(120, 163, id(clock_modern_date_font), white, date_text);

        return;
      }

      // -------------------------------------------------------------------
      // CLEAN ARC — stripped-back digital face focused on time and date.
      // -------------------------------------------------------------------
      if (clock_style == "clean_arc") {
        it.fill(background);

        draw_centered(120, 82, id(clock_clean_time_font), white, digital_time);
        draw_centered(120, 174, id(clock_clean_date_font), gray, date_text);

        return;
      }

      // -------------------------------------------------------------------
      // WEATHER STATION — seven-segment clock with live HA weather data.
      // -------------------------------------------------------------------
      if (clock_style == "weather_station") {
        it.fill(background);

        const Color orange(255, 92, 0);
        const Color amber(255, 180, 0);
        const Color weather_white(245, 245, 245);
        const Color weather_blue(80, 180, 255);
        const Color weather_gray(150, 150, 160);

        // Thin two-tone inner ring like the reference clock.
        it.circle(120, 120, 106, orange);
        for (int i = 20; i <= 38; i++) {
          int x, y;
          scaled_point(i, 0.94f, x, y);
          it.filled_circle(x, y, 1, amber);
        }

        // Weekday arc. Highlight today in orange.
        static const char *WEATHER_DAYS[] = {
          "MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"
        };
        static constexpr int DAY_X[] = {37, 64, 92, 120, 148, 176, 203};
        static constexpr int DAY_Y[] = {43, 30, 23, 20, 23, 30, 43};

        int active_day = -1;
        if (now.is_valid()) {
          active_day = now.day_of_week == 1 ? 6 : now.day_of_week - 2;
        }

        for (int i = 0; i < 7; i++) {
          draw_centered(DAY_X[i], DAY_Y[i],
                        id(clock_weather_weekday_font),
                        i == active_day ? orange : weather_white,
                        WEATHER_DAYS[i]);
        }

        // Compact calendar date above the main time.
        char weather_date[12] = "--/--";
        if (now.is_valid())
          snprintf(weather_date, sizeof(weather_date), "%02d/%02d",
                   now.month, now.day_of_month);
        draw_centered(120, 53, id(clock_weather_date_font),
                      weather_white, weather_date);

        // Draw true seven-segment numerals instead of approximating them with a font.
        auto draw_segment_digit = [&](int x, int y, int digit, Color color) {
          static constexpr uint8_t MASKS[10] = {
            0x3F, 0x06, 0x5B, 0x4F, 0x66,
            0x6D, 0x7D, 0x07, 0x7F, 0x6F
          };
          if (digit < 0 || digit > 9) return;

          const uint8_t mask = MASKS[digit];
          constexpr int W = 32;
          constexpr int H = 58;
          constexpr int T = 6;
          constexpr int HALF = H / 2;

          // a
          if (mask & 0x01) it.filled_rectangle(x + T, y, W - 2*T, T, color);
          // b
          if (mask & 0x02) it.filled_rectangle(x + W - T, y + T, T, HALF - T, color);
          // c
          if (mask & 0x04) it.filled_rectangle(x + W - T, y + HALF, T, HALF - T, color);
          // d
          if (mask & 0x08) it.filled_rectangle(x + T, y + H - T, W - 2*T, T, color);
          // e
          if (mask & 0x10) it.filled_rectangle(x, y + HALF, T, HALF - T, color);
          // f
          if (mask & 0x20) it.filled_rectangle(x, y + T, T, HALF - T, color);
          // g
          if (mask & 0x40) it.filled_rectangle(x + T, y + HALF - T/2,
                                                W - 2*T, T, color);
        };

        int h24 = now.is_valid() ? now.hour : 0;
        int minute = now.is_valid() ? now.minute : 0;
        draw_segment_digit(29, 72, now.is_valid() ? h24 / 10 : 8, orange);
        draw_segment_digit(65, 72, now.is_valid() ? h24 % 10 : 8, orange);
        it.filled_circle(106, 91, 4, orange);
        it.filled_circle(106, 112, 4, orange);
        draw_segment_digit(115, 72, now.is_valid() ? minute / 10 : 8, orange);
        draw_segment_digit(151, 72, now.is_valid() ? minute % 10 : 8, orange);

        // Weather-condition icon derived from the standard weather entity state.
        const std::string condition = id(clock_weather_condition_value);

        auto draw_sun = [&](int cx, int cy) {
          it.filled_circle(cx, cy, 8, amber);
          it.line(cx, cy - 14, cx, cy - 11, amber);
          it.line(cx, cy + 11, cx, cy + 14, amber);
          it.line(cx - 14, cy, cx - 11, cy, amber);
          it.line(cx + 11, cy, cx + 14, cy, amber);
          it.line(cx - 10, cy - 10, cx - 8, cy - 8, amber);
          it.line(cx + 8, cy - 8, cx + 10, cy - 10, amber);
          it.line(cx - 10, cy + 10, cx - 8, cy + 8, amber);
          it.line(cx + 8, cy + 8, cx + 10, cy + 10, amber);
        };

        auto draw_cloud = [&](int cx, int cy) {
          it.filled_circle(cx - 8, cy + 2, 7, weather_white);
          it.filled_circle(cx, cy - 3, 10, weather_white);
          it.filled_circle(cx + 9, cy + 2, 7, weather_white);
          it.filled_rectangle(cx - 14, cy + 2, 28, 8, weather_white);
        };

        auto draw_rain = [&](int cx, int cy, bool heavy) {
          const int drop = heavy ? 7 : 5;
          it.line(cx - 9, cy + 12, cx - 12, cy + 12 + drop, weather_blue);
          it.line(cx, cy + 12, cx - 3, cy + 12 + drop, weather_blue);
          it.line(cx + 9, cy + 12, cx + 6, cy + 12 + drop, weather_blue);
        };

        if (condition == "sunny") {
          draw_sun(120, 160);
        } else if (condition == "clear-night") {
          it.filled_circle(120, 160, 12, weather_white);
          it.filled_circle(126, 155, 11, background);
        } else if (condition == "partlycloudy") {
          draw_sun(111, 153);
          draw_cloud(123, 163);
        } else if (condition == "cloudy") {
          draw_cloud(120, 160);
        } else if (condition == "rainy" || condition == "pouring") {
          draw_cloud(120, 153);
          draw_rain(120, 153, condition == "pouring");
        } else if (condition == "lightning" ||
                   condition == "lightning-rainy") {
          draw_cloud(120, 151);
          it.line(122, 160, 116, 170, amber);
          it.line(116, 170, 123, 168, amber);
          it.line(123, 168, 118, 177, amber);
          if (condition == "lightning-rainy")
            draw_rain(120, 151, false);
        } else if (condition == "snowy" ||
                   condition == "snowy-rainy") {
          draw_cloud(120, 151);
          for (int dx : {-10, 0, 10}) {
            it.line(120 + dx - 3, 166, 120 + dx + 3, 172, weather_white);
            it.line(120 + dx + 3, 166, 120 + dx - 3, 172, weather_white);
          }
          if (condition == "snowy-rainy")
            draw_rain(120, 151, false);
        } else if (condition == "hail") {
          draw_cloud(120, 151);
          it.filled_circle(110, 169, 2, weather_white);
          it.filled_circle(120, 171, 2, weather_white);
          it.filled_circle(130, 169, 2, weather_white);
        } else if (condition == "fog") {
          it.line(104, 153, 136, 153, weather_gray);
          it.line(99, 160, 132, 160, weather_gray);
          it.line(108, 167, 141, 167, weather_gray);
        } else if (condition == "windy" ||
                   condition == "windy-variant") {
          it.line(100, 153, 132, 153, weather_white);
          it.line(108, 160, 141, 160, weather_white);
          it.line(98, 167, 126, 167, weather_white);
          if (condition == "windy-variant")
            it.filled_circle(136, 151, 4, weather_gray);
        } else if (condition == "exceptional") {
          it.line(120, 148, 120, 165, amber);
          it.filled_circle(120, 171, 2, amber);
        } else {
          draw_centered(120, 160, id(clock_weather_date_font),
                        weather_gray, "?");
        }

        // Current weather metrics from the same weather entity.
        char weather_temp[20] = "--°";
        char weather_humidity[16] = "--%";

        const float temp = id(clock_weather_temperature_value);
        const float humidity = id(clock_weather_humidity_value);
        const std::string &temp_unit = id(clock_weather_temperature_unit_value);

        if (std::isfinite(temp)) {
          snprintf(weather_temp, sizeof(weather_temp), "%.0f%s",
                   temp, temp_unit.empty() ? "°" : temp_unit.c_str());
        }
        if (std::isfinite(humidity)) {
          snprintf(weather_humidity, sizeof(weather_humidity),
                   "%.0f%%", humidity);
        }

        draw_centered(55, 207, id(clock_weather_metric_font),
                      weather_white, weather_temp);
        draw_centered(185, 207, id(clock_weather_metric_font),
                      weather_white, weather_humidity);

        return;
      }

      // Unknown value: display a visible diagnostic instead of silently
      // selecting another design.
      it.fill(background);
      draw_centered(120, 92, id(clock_small_font), red, "CLOCK STYLE");
      draw_centered(120, 126, id(clock_small_font), white, "UNKNOWN");
      draw_centered(120, 164, id(clock_tiny_font), gray, "${clock_face_style}");
