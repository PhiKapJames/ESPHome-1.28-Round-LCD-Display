# Reusable numeric/temperature rotation page.
# Include this file once per page with a unique page_id.
substitutions:
  page_id: example_numeric
  page_label: Metric
  page_entity: sensor.example_metric
  page_duration_ms: '8000'
  page_order: '100'
  page_unit: °F
  page_suffix: °
  page_decimals: '1'
  page_panel_style: '1'
  page_color_red: 0%
  page_color_green: 80%
  page_color_blue: 100%

esphome:
  on_boot:
  - priority: -50
    then:
    - lambda: |-
        id(rotation_pages).push_back(id(rotation_page_${page_id}));
        id(rotation_durations).push_back(${page_duration_ms});
        id(rotation_orders).push_back(${page_order});
        id(rotation_enter_callbacks).push_back([](){});
        id(rotation_exit_callbacks).push_back([](){});
        id(rotation_registry_sorted) = false;

sensor:
- platform: homeassistant
  id: rotation_sensor_${page_id}
  entity_id: ${page_entity}
  internal: true
  state_class: measurement
  unit_of_measurement: ${page_unit}
  accuracy_decimals: ${page_decimals}

color:
- id: rotation_color_${page_id}
  red: ${page_color_red}
  green: ${page_color_green}
  blue: ${page_color_blue}

display:
- id: !extend main_display
  pages:
  - id: rotation_page_${page_id}
    lambda: |-
      const Color accent = id(rotation_color_${page_id});
      const Color dim(accent.r / 2, accent.g / 2, accent.b / 2);

      auto draw_centered = [&](int x, int y, font::Font *f,
                               Color color, const char *text) {
        const int baseline = y + f->get_capheight() / 2;
        it.print(x, baseline, f, color, TextAlign::BASELINE_CENTER, text);
      };

      static constexpr int METRIC_ARC_POINTS[][2] = {
        {20,63},{22,59},{25,56},{27,52},{29,49},{32,46},{35,43},{37,40},
        {40,37},{43,35},{46,32},{49,29},{52,27},{56,25},{59,22},{63,20},
        {66,18},{70,17},{73,15},{77,13},{81,12},{84,11},
        {156,11},{159,12},{163,13},{167,15},{170,17},{174,18},{178,20},
        {181,22},{184,25},{188,27},{191,29},{194,32},{197,35},{200,37},
        {203,40},{205,43},{208,46},{211,49},{213,52},{215,56},{218,59},{220,63},
        {220,177},{218,181},{215,184},{213,188},{211,191},{208,194},{205,197},
        {203,200},{200,203},{197,205},{194,208},{191,211},{188,213},{184,215},
        {181,218},{178,220},{174,222},{170,223},{167,225},{163,227},{159,228},
        {156,229},{84,229},{81,228},{77,227},{73,225},{70,223},{66,222},
        {63,220},{59,218},{56,215},{52,213},{49,211},{46,208},{43,205},
        {40,203},{37,200},{35,197},{32,194},{29,191},{27,188},{25,184},
        {22,181},{20,177}
      };

      auto rounded_box = [&](int x, int y, int width, int height,
                             int radius, Color color) {
        if (radius <= 0) {
          it.filled_rectangle(x, y, width, height, color);
          return;
        }
        it.filled_rectangle(x + radius, y, width - 2 * radius, height, color);
        it.filled_rectangle(x, y + radius, width, height - 2 * radius, color);
        it.filled_circle(x + radius, y + radius, radius, color);
        it.filled_circle(x + width - radius - 1, y + radius, radius, color);
        it.filled_circle(x + radius, y + height - radius - 1, radius, color);
        it.filled_circle(x + width - radius - 1,
                         y + height - radius - 1, radius, color);
      };

      it.fill(Color::BLACK);
      it.circle(120, 120, 115, dim);
      for (const auto &point : METRIC_ARC_POINTS)
        it.filled_circle(point[0], point[1], 3, accent);

      it.print(120, 71, id(title_font), accent,
               TextAlign::BASELINE_CENTER, "${page_label}");

      constexpr int PANEL_STYLE = ${page_panel_style};
      static_assert(PANEL_STYLE >= 0 && PANEL_STYLE <= 2,
                    "page_panel_style must be 0, 1, or 2");

      const Color panel_fill(64, 64, 64);
      const Color value_background =
          PANEL_STYLE == 0 ? Color::BLACK : panel_fill;

      if (PANEL_STYLE == 1) {
        rounded_box(8, 83, 225, 73, 16, accent);
        rounded_box(11, 86, 219, 67, 13, panel_fill);
      } else if (PANEL_STYLE == 2) {
        it.filled_rectangle(0, 83, 240, 73, panel_fill);
        it.filled_rectangle(0, 83, 240, 3, accent);
        it.filled_rectangle(0, 153, 240, 3, accent);
      } else {
        it.filled_rectangle(78, 83, 32, 3, accent);
        it.filled_rectangle(130, 83, 32, 3, accent);
        it.filled_circle(120, 84, 3, accent);
      }

      const float value = id(rotation_sensor_${page_id}).state;
      const bool value_ok = std::isfinite(value);
      char value_text[32];

      if (value_ok) {
        snprintf(value_text, sizeof(value_text), "%.*f%s",
                 ${page_decimals}, value, "${page_suffix}");

        int width, offset, baseline, height;
        id(temp_font)->measure(value_text, &width, &offset, &baseline, &height);
        if (width > 220 && ${page_decimals} > 0) {
          snprintf(value_text, sizeof(value_text), "%.0f%s",
                   value, "${page_suffix}");
        }
      } else {
        snprintf(value_text, sizeof(value_text), "%s%s",
                 ${page_decimals} > 0 ? "--.-" : "--", "${page_suffix}");
      }

      const int value_baseline =
          120 + id(temp_font)->get_capheight() / 2;
      it.print(120, value_baseline, id(temp_font), Color::WHITE,
               TextAlign::BASELINE_CENTER, value_text, value_background);


      auto now = id(sntp_time).now();
      char time_text[16];
      if (now.is_valid()) {
        int hour12 = now.hour % 12;
        if (hour12 == 0) hour12 = 12;
        snprintf(time_text, sizeof(time_text), "%d:%02d %s",
                 hour12, now.minute, now.hour >= 12 ? "PM" : "AM");
      } else {
        snprintf(time_text, sizeof(time_text), "--:--");
      }
      draw_centered(120, 189, id(time_font), Color::WHITE, time_text);

      // Page indicator: show at most nine dots at once. For longer rotations,
      // slide the window around the active page and draw chevrons when pages
      // exist before or after the visible range.
      const int count = static_cast<int>(id(rotation_pages).size());
      const int active = id(active_rotation_index);
      if (count > 0 && active >= 0) {
        constexpr int MAX_VISIBLE_DOTS = 9;
        constexpr int DOT_STEP = 12;
        constexpr int DOT_Y = 221;

        const int visible = count < MAX_VISIBLE_DOTS ? count : MAX_VISIBLE_DOTS;
        int first = 0;

        if (count > visible) {
          first = active - visible / 2;
          if (first < 0) first = 0;
          const int max_first = count - visible;
          if (first > max_first) first = max_first;
        }

        const int last = first + visible - 1;
        const bool more_before = first > 0;
        const bool more_after = last < count - 1;
        const int width = DOT_STEP * (visible - 1);
        const int start_x = 120 - width / 2;

        for (int slot = 0; slot < visible; slot++) {
          const int page_index = first + slot;
          const int x = start_x + slot * DOT_STEP;

          if (page_index == active) {
            it.filled_circle(x, DOT_Y, 7, Color::BLACK);
            it.filled_ring(x, DOT_Y, 6, 5, accent);
            it.filled_circle(x, DOT_Y, 3, Color::WHITE);
          } else {
            it.filled_circle(x, DOT_Y, 2, Color(64, 64, 85));
          }
        }

        const Color arrow_color(150, 150, 165);
        if (more_before) {
          it.line(start_x - 14, DOT_Y, start_x - 8, DOT_Y - 5, arrow_color);
          it.line(start_x - 14, DOT_Y, start_x - 8, DOT_Y + 5, arrow_color);
        }
        if (more_after) {
          it.line(start_x + width + 14, DOT_Y,
                  start_x + width + 8, DOT_Y - 5, arrow_color);
          it.line(start_x + width + 14, DOT_Y,
                  start_x + width + 8, DOT_Y + 5, arrow_color);
        }
      }
