# Shared scheduler, display bus, backlight, heap diagnostics, and dynamic page registry.
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  # Public ESP-IDF heap-capability API used by camera RAM guards and diagnostics.
  includes:
  - <esp_heap_caps.h>
  on_boot:
  - priority: -100
    then:
    - delay: 1s
    - lambda: !lambda |-
        id(display_initialized) = true;
    - if:
        condition:
          lambda: return id(lcd_backlight_switch).state;
        then:
        - script.execute: display_rotation
  project:
    name: phikapjames.round-minions
    version: 0.6.7

logger:
  level: INFO

spi:
  clk_pin: ${spi_clk_pin}
  mosi_pin: ${spi_mosi_pin}

time:
- platform: homeassistant
  id: ha_time
  timezone: ${timezone}
  on_time_sync:
    then:
    - script.execute: refresh_visible_time

globals:
- id: rotation_content_index
  type: unsigned int
  restore_value: false
  initial_value: '0'
- id: active_rotation_index
  type: int
  restore_value: false
  initial_value: '-1'
- id: rotation_pages
  type: std::vector<esphome::display::DisplayPage *>
  restore_value: false
  initial_value: 'std::vector<esphome::display::DisplayPage *>{}'
- id: rotation_durations
  type: std::vector<uint32_t>
  restore_value: false
  initial_value: 'std::vector<uint32_t>{}'
- id: rotation_orders
  type: std::vector<int>
  restore_value: false
  initial_value: 'std::vector<int>{}'
- id: rotation_enter_callbacks
  type: std::vector<std::function<void()>>
  restore_value: false
  initial_value: 'std::vector<std::function<void()>>{}'
- id: rotation_exit_callbacks
  type: std::vector<std::function<void()>>
  restore_value: false
  initial_value: 'std::vector<std::function<void()>>{}'
- id: rotation_registry_sorted
  type: bool
  restore_value: false
  initial_value: 'false'
- id: active_content_duration_ms
  type: uint32_t
  restore_value: false
  initial_value: '8000'
- id: normal_page
  type: esphome::display::DisplayPage *
  restore_value: false
  initial_value: nullptr
- id: normal_is_clock
  type: bool
  restore_value: false
  initial_value: 'false'
- id: normal_remaining_ms
  type: uint32_t
  restore_value: false
  initial_value: '8000'
- id: normal_started_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: rotation_resume_pending
  type: bool
  restore_value: false
  initial_value: 'false'
- id: display_initialized
  type: bool
  restore_value: false
  initial_value: 'false'
- id: camera_alert_active
  type: bool
  restore_value: false
  initial_value: 'false'
- id: display_suspend_callbacks
  type: std::vector<std::function<void()>>
  restore_value: false
  initial_value: 'std::vector<std::function<void()>>{}'

script:
- id: suspend_display
  mode: restart
  then:
  - script.stop: display_rotation
  - lambda: |-
      // Exit the active normal content page once so page-specific resources
      // (for example an optional camera rotation page) can clean themselves up.
      // Camera alerts already ran the normal page's exit callback before taking
      // over the display, so do not call it a second time during an alert.
      if (!id(camera_alert_active) && !id(normal_is_clock)) {
        const int index = id(active_rotation_index);
        if (index >= 0 &&
            static_cast<size_t>(index) < id(rotation_exit_callbacks).size() &&
            id(rotation_exit_callbacks)[index]) {
          id(rotation_exit_callbacks)[index]();
        }
      }

      // Feature packages can register additional cleanup without making the
      // base profile depend on those optional components.
      for (auto &callback : id(display_suspend_callbacks)) {
        if (callback)
          callback();
      }

      // Resume from a clean rotation when the display is explicitly enabled.
      id(rotation_resume_pending) = false;
      id(rotation_content_index) = 0;
      id(active_rotation_index) = -1;
      id(normal_page) = nullptr;
      id(normal_is_clock) = false;
      id(normal_remaining_ms) = 1;
      id(normal_started_ms) = millis();

- id: resume_display
  mode: restart
  then:
  - if:
      condition:
        lambda: |-
          return id(display_initialized) &&
                 id(lcd_backlight_switch).state;
      then:
      - script.stop: display_rotation
      - lambda: |-
          id(rotation_resume_pending) = false;
          id(rotation_content_index) = 0;
          id(active_rotation_index) = -1;
          id(normal_page) = nullptr;
          id(normal_is_clock) = false;
          id(normal_remaining_ms) = 1;
          id(normal_started_ms) = millis();
      - script.execute: display_rotation


- id: refresh_visible_time
  mode: single
  then:
  - if:
      condition:
        lambda: |-
          return !id(camera_alert_active) &&
                 id(lcd_backlight_switch).state;
      then:
      - component.update: main_display

- id: display_rotation
  mode: single
  then:
  - while:
      condition:
        lambda: return id(lcd_backlight_switch).state;
      then:
      - lambda: !lambda |-
          if (!id(rotation_registry_sorted)) {
            const size_t count = id(rotation_pages).size();
            for (size_t i = 0; i < count; i++) {
              size_t best = i;
              for (size_t j = i + 1; j < count; j++) {
                if (id(rotation_orders)[j] < id(rotation_orders)[best])
                  best = j;
              }
              if (best != i) {
                std::swap(id(rotation_pages)[i], id(rotation_pages)[best]);
                std::swap(id(rotation_durations)[i], id(rotation_durations)[best]);
                std::swap(id(rotation_orders)[i], id(rotation_orders)[best]);
                std::swap(id(rotation_enter_callbacks)[i], id(rotation_enter_callbacks)[best]);
                std::swap(id(rotation_exit_callbacks)[i], id(rotation_exit_callbacks)[best]);
              }
            }
            id(rotation_registry_sorted) = true;
          }

          if (id(rotation_resume_pending) && id(normal_page) != nullptr) {
            id(rotation_resume_pending) = false;
            const int index = id(active_rotation_index);
            if (!id(normal_is_clock) &&
                index >= 0 &&
                static_cast<size_t>(index) < id(rotation_enter_callbacks).size() &&
                id(rotation_enter_callbacks)[index]) {
              id(rotation_enter_callbacks)[index]();
            }
            id(main_display).show_page(id(normal_page));
          } else {
            id(rotation_resume_pending) = false;
            const size_t count = id(rotation_pages).size();

            if (count == 0) {
              id(active_rotation_index) = -1;
              id(normal_is_clock) = true;
              id(normal_page) = id(page_clock);
              id(normal_remaining_ms) = ${clock_page_duration_ms};
              id(main_display).show_page(id(page_clock));
            } else {
              if (id(rotation_content_index) >= count)
                id(rotation_content_index) = 0;

              const size_t index = id(rotation_content_index);
              id(active_rotation_index) = static_cast<int>(index);
              id(active_content_duration_ms) = id(rotation_durations)[index];
              id(normal_remaining_ms) = id(rotation_durations)[index];
              id(normal_page) = id(rotation_pages)[index];
              id(normal_is_clock) = false;

              if (id(rotation_enter_callbacks)[index])
                id(rotation_enter_callbacks)[index]();

              id(main_display).show_page(id(rotation_pages)[index]);
              id(rotation_content_index) =
                  static_cast<unsigned int>((index + 1) % count);
            }
          }

      - component.update: main_display
      - lambda: id(normal_started_ms) = millis();
      - delay: !lambda |-
          return id(normal_remaining_ms);

      - if:
          condition:
            lambda: return !id(normal_is_clock);
          then:
          - lambda: |-
              const int index = id(active_rotation_index);
              if (index >= 0 &&
                  static_cast<size_t>(index) < id(rotation_exit_callbacks).size() &&
                  id(rotation_exit_callbacks)[index]) {
                id(rotation_exit_callbacks)[index]();
              }

              id(normal_is_clock) = true;
              id(normal_page) = id(page_clock);
              id(normal_remaining_ms) = ${clock_page_duration_ms};
              id(main_display).show_page(id(page_clock));
          - component.update: main_display
          - lambda: id(normal_started_ms) = millis();
          - delay: !lambda |-
              return id(normal_remaining_ms);

display:
- platform: mipi_spi
  id: main_display
  model: GC9A01A
  data_rate: ${display_spi_rate}
  color_depth: ${display_color_depth}
  buffer_size: ${display_buffer_size}
  invert_colors: true
  cs_pin: ${display_cs_pin}
  dc_pin: ${display_dc_pin}
  reset_pin: ${display_reset_pin}
  rotation: ${display_rotation_degrees}
  update_interval: never
  auto_clear_enabled: false

output:
- platform: gpio
  pin: ${backlight_pin}
  id: lcd_backlight

switch:
- platform: output
  name: LCD Backlight
  id: lcd_backlight_switch
  output: lcd_backlight
  restore_mode: ${backlight_restore_mode}
  on_turn_off:
  - script.execute: suspend_display
  on_turn_on:
  - script.execute: resume_display

sensor:
- platform: template
  name: Free Heap
  entity_category: diagnostic
  unit_of_measurement: B
  accuracy_decimals: 0
  state_class: measurement
  update_interval: 60s
  lambda: return heap_caps_get_free_size(MALLOC_CAP_8BIT);
- platform: template
  name: Largest Free Heap Block
  entity_category: diagnostic
  unit_of_measurement: B
  accuracy_decimals: 0
  state_class: measurement
  update_interval: 60s
  lambda: return heap_caps_get_largest_free_block(MALLOC_CAP_8BIT);
