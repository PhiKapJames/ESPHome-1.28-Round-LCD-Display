# Shared scheduler, display bus, backlight, and heap diagnostics. Credentials are deliberately absent.
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  includes:
  - <esp_heap_caps.h>
  on_boot:
  - priority: -100
    then:
    - delay: 1s
    - lambda: !lambda |-
        id(display_initialized) = true;
    - script.execute: display_rotation
  project:
    name: phikapjames.round-minions
    version: 0.1.0
logger:
  level: INFO
spi:
  clk_pin: ${spi_clk_pin}
  mosi_pin: ${spi_mosi_pin}
time:
- platform: homeassistant
  id: sntp_time
  timezone: ${timezone}
  on_time_sync:
    then:
    - script.execute: refresh_visible_time
  on_time:
  - seconds: 0
    minutes: /1
    then:
    - script.execute: refresh_visible_time
globals:
- id: rotation_content_index
  type: unsigned int
  restore_value: false
  initial_value: '0'
- id: active_metric_index
  type: int
  restore_value: false
  initial_value: '0'
- id: active_content_duration_ms
  type: uint32_t
  restore_value: false
  initial_value: '8000'
- id: normal_page
  type: esphome::display::DisplayPage *
  restore_value: false
  initial_value: nullptr
- id: normal_is_clock
  type: bool
  restore_value: false
  initial_value: 'false'
- id: normal_remaining_ms
  type: uint32_t
  restore_value: false
  initial_value: '8000'
- id: normal_started_ms
  type: uint32_t
  restore_value: false
  initial_value: '0'
- id: rotation_resume_pending
  type: bool
  restore_value: false
  initial_value: 'false'
- id: display_initialized
  type: bool
  restore_value: false
  initial_value: 'false'
- id: camera_alert_active
  type: bool
  restore_value: false
  initial_value: 'false'
script:
- id: refresh_visible_time
  mode: single
  then:
  - if:
      condition:
        lambda: |-
          auto *page = id(main_display).get_active_page();
          return !id(camera_alert_active) &&
                 id(lcd_backlight_switch).state &&
                 (page == id(page_clock) || page == id(page_metric));
      then:
      - component.update: main_display
- id: display_rotation
  mode: single
  then:
  - while:
      condition:
        lambda: return true;
      then:
      - lambda: !lambda |-
          if (id(rotation_resume_pending) && id(normal_page) != nullptr) {
            id(rotation_resume_pending) = false;
            id(main_display).show_page(id(normal_page));
          } else {
            id(rotation_resume_pending) = false;
            struct ContentPage {
              display::DisplayPage *page;
              int metric_index;
              uint32_t duration_ms;
              bool enabled;
            };
            const ContentPage candidates[] = {
              {id(page_metric), 0, ${metric_1_duration_ms}, ${ 'true' if metric_1_enabled | string | lower == 'true' else 'false' }},
              {id(page_metric), 1, ${metric_2_duration_ms}, ${ 'true' if metric_2_enabled | string | lower == 'true' else 'false' }},
              {id(page_metric), 2, ${metric_3_duration_ms}, ${ 'true' if metric_3_enabled | string | lower == 'true' else 'false' }},
              {id(page_metric), 3, ${metric_4_duration_ms}, ${ 'true' if metric_4_enabled | string | lower == 'true' else 'false' }},
              {id(page_metric), 4, ${metric_5_duration_ms}, ${ 'true' if metric_5_enabled | string | lower == 'true' else 'false' }},
              {id(page_metric), 5, ${metric_6_duration_ms}, ${ 'true' if metric_6_enabled | string | lower == 'true' else 'false' }},
            };
            // No camera entry: snapshots interrupt the playlist, never join it.
            constexpr bool any_metric_enabled = ${ 'true' if metric_1_enabled | string | lower == 'true' else 'false' } || ${ 'true' if metric_2_enabled | string | lower == 'true' else 'false' } || ${ 'true' if metric_3_enabled | string | lower == 'true' else 'false' } || ${ 'true' if metric_4_enabled | string | lower == 'true' else 'false' } || ${ 'true' if metric_5_enabled | string | lower == 'true' else 'false' } || ${ 'true' if metric_6_enabled | string | lower == 'true' else 'false' };
            static_assert(any_metric_enabled, "Enable at least one metric slot");
            ContentPage content_pages[6];
            unsigned int content_count = 0;
            for (const auto &candidate : candidates) {
              if (candidate.enabled) content_pages[content_count++] = candidate;
            }
            if (id(rotation_content_index) >= content_count)
              id(rotation_content_index) = 0;
            const auto &item = content_pages[id(rotation_content_index)];
            id(active_metric_index) = item.metric_index;
            id(active_content_duration_ms) = item.duration_ms;
            id(normal_remaining_ms) = item.duration_ms;
            id(normal_page) = item.page;
            id(normal_is_clock) = false;
            id(main_display).show_page(item.page);
            id(rotation_content_index) =
                (id(rotation_content_index) + 1) % content_count;
          }
      - component.update: main_display
      - lambda: id(normal_started_ms) = millis();
      - delay: !lambda |-
          return id(normal_remaining_ms);
      - if:
          condition:
            lambda: return !id(normal_is_clock);
          then:
          - lambda: |-
              id(normal_is_clock) = true;
              id(normal_page) = id(page_clock);
              id(normal_remaining_ms) = ${clock_page_duration_ms};
              id(main_display).show_page(id(page_clock));
          - component.update: main_display
          - lambda: id(normal_started_ms) = millis();
          - delay: !lambda |-
              return id(normal_remaining_ms);
display:
- platform: mipi_spi
  id: main_display
  model: GC9A01A
  data_rate: ${display_spi_rate}
  color_depth: ${display_color_depth}
  buffer_size: ${display_buffer_size}
  invert_colors: true
  cs_pin: ${display_cs_pin}
  dc_pin: ${display_dc_pin}
  reset_pin: ${display_reset_pin}
  rotation: ${display_rotation_degrees}
  update_interval: never
  auto_clear_enabled: false
output:
- platform: gpio
  pin: ${backlight_pin}
  id: lcd_backlight
switch:
- platform: output
  name: LCD Backlight
  id: lcd_backlight_switch
  output: lcd_backlight
  restore_mode: ALWAYS_ON
sensor:
- platform: template
  name: Free Heap
  entity_category: diagnostic
  unit_of_measurement: B
  accuracy_decimals: 0
  state_class: measurement
  update_interval: 60s
  lambda: return heap_caps_get_free_size(MALLOC_CAP_8BIT);
- platform: template
  name: Largest Free Heap Block
  entity_category: diagnostic
  unit_of_measurement: B
  accuracy_decimals: 0
  state_class: measurement
  update_interval: 60s
  lambda: return heap_caps_get_largest_free_block(MALLOC_CAP_8BIT);
