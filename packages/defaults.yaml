# Public defaults only. Override these in your private device/site YAML.
substitutions:
  device_name: round-minion
  friendly_name: Round Minion
  timezone: Etc/UTC
  graph_interval: 12h
  clock_page_duration_ms: '8000'
  metric_panel_style: '1'
  spi_clk_pin: GPIO1
  spi_mosi_pin: GPIO2
  display_cs_pin: GPIO5
  display_dc_pin: GPIO4
  display_reset_pin: GPIO9
  backlight_pin: GPIO6
  display_rotation_degrees: '0'
  display_spi_rate: 80MHz
  metric_1_enabled: 'true'
  metric_1_label: Metric 1
  metric_1_entity: sensor.example_metric_1
  metric_1_duration_ms: '8000'
  metric_1_unit: °F
  metric_1_suffix: °
  metric_1_decimals: '1'
  metric_2_enabled: 'true'
  metric_2_label: Metric 2
  metric_2_entity: sensor.example_metric_2
  metric_2_duration_ms: '8000'
  metric_2_unit: °F
  metric_2_suffix: °
  metric_2_decimals: '1'
  metric_3_enabled: 'true'
  metric_3_label: Metric 3
  metric_3_entity: sensor.example_metric_3
  metric_3_duration_ms: '8000'
  metric_3_unit: °F
  metric_3_suffix: °
  metric_3_decimals: '1'
  metric_4_enabled: 'true'
  metric_4_label: Metric 4
  metric_4_entity: sensor.example_metric_4
  metric_4_duration_ms: '8000'
  metric_4_unit: °F
  metric_4_suffix: °
  metric_4_decimals: '1'
  metric_5_enabled: 'true'
  metric_5_label: Metric 5
  metric_5_entity: sensor.example_metric_5
  metric_5_duration_ms: '8000'
  metric_5_unit: °F
  metric_5_suffix: °
  metric_5_decimals: '1'
  metric_6_enabled: 'true'
  metric_6_label: Battery
  metric_6_entity: sensor.example_metric_6
  metric_6_duration_ms: '8000'

  # Camera source 1 keeps the original single-camera names as compatibility aliases.
  camera_entity: camera.example_camera
  person_entity: binary_sensor.example_person
  camera_source_label: CAMERA
  camera_status_label: camera

  camera_1_enabled: 'true'
  camera_1_entity: ${camera_entity}
  camera_1_source_label: ${camera_source_label}
  camera_1_status_label: ${camera_status_label}
  camera_1_button_name: Show Camera Snapshot
  camera_1_trigger_person: 'true'
  camera_1_person_entity: ${person_entity}
  camera_1_trigger_vehicle: 'false'
  camera_1_vehicle_entity: binary_sensor.example_vehicle
  camera_1_cooldown_ms: '60000'

  camera_2_enabled: 'false'
  camera_2_entity: camera.example_camera_2
  camera_2_source_label: CAMERA 2
  camera_2_status_label: camera 2
  camera_2_button_name: Show Camera 2 Snapshot
  camera_2_trigger_person: 'false'
  camera_2_person_entity: binary_sensor.example_person_2
  camera_2_trigger_vehicle: 'false'
  camera_2_vehicle_entity: binary_sensor.example_vehicle_2
  camera_2_cooldown_ms: '60000'

  camera_3_enabled: 'false'
  camera_3_entity: camera.example_camera_3
  camera_3_source_label: CAMERA 3
  camera_3_status_label: camera 3
  camera_3_button_name: Show Camera 3 Snapshot
  camera_3_trigger_person: 'false'
  camera_3_person_entity: binary_sensor.example_person_3
  camera_3_trigger_vehicle: 'false'
  camera_3_vehicle_entity: binary_sensor.example_vehicle_3
  camera_3_cooldown_ms: '60000'

  camera_4_enabled: 'false'
  camera_4_entity: camera.example_camera_4
  camera_4_source_label: CAMERA 4
  camera_4_status_label: camera 4
  camera_4_button_name: Show Camera 4 Snapshot
  camera_4_trigger_person: 'false'
  camera_4_person_entity: binary_sensor.example_person_4
  camera_4_trigger_vehicle: 'false'
  camera_4_vehicle_entity: binary_sensor.example_vehicle_4
  camera_4_cooldown_ms: '60000'
