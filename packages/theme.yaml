# Working font families, sizes, and colors. No font files are redistributed.
font:
- id: title_font
  file: gfonts://Roboto
  size: 44
- id: temp_font
  file: gfonts://Roboto
  size: 84
- id: time_font
  file: gfonts://Roboto
  size: 36
- id: clock_hour_font
  file: gfonts://Oswald
  size: 92
- id: clock_minute_font
  file: gfonts://Oswald
  size: 92
color:
- id: color_clock_ring_outer
  red: 0%
  green: 80%
  blue: 100%
- id: color_clock_ring_inner
  red: 0%
  green: 38%
  blue: 70%
- id: color_clock_accent
  red: 100%
  green: 25%
  blue: 100%
