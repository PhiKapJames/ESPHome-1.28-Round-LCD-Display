# Reusable battery-percentage rotation page.
# Include this file repeatedly with a unique page_id.
esphome:
  on_boot:
  - priority: -100
    then:
    - lambda: |-
        id(rotation_orders).push_back(${page_order});
        id(rotation_pages).push_back(id(rotation_page_${page_id}));
        id(rotation_durations).push_back(${page_duration_ms});
        id(rotation_kinds).push_back(0);
        id(rotation_camera_entities).push_back(std::string());
        id(rotation_camera_labels).push_back(std::string());
        id(rotation_camera_paths).push_back(nullptr);

color:
- id: rotation_graph_color_${page_id}
  red: ${page_graph_color_red}
  green: ${page_graph_color_green}
  blue: ${page_graph_color_blue}

sensor:
- platform: homeassistant
  id: rotation_sensor_${page_id}
  entity_id: ${page_entity}
  internal: true
  state_class: measurement
  unit_of_measurement: '%'
  accuracy_decimals: 1

graph:
- id: rotation_graph_${page_id}
  duration: ${page_graph_interval}
  width: 174
  height: 18
  border: false
  traces:
  - sensor: rotation_sensor_${page_id}
    color: rotation_graph_color_${page_id}
    line_thickness: 3
    continuous: true

display:
- id: !extend main_display
  pages:
  - id: rotation_page_${page_id}
    lambda: |-
      const float value = id(rotation_sensor_${page_id}).state;
      const bool value_ok =
          std::isfinite(value) && value >= 0.0f && value <= 100.0f;

      Color accent(96, 96, 96);
      if (value_ok) {
        if (value < 25.0f) accent = Color(220, 35, 35);
        else if (value < 50.0f) accent = Color(245, 190, 20);
        else if (value < 75.0f) accent = Color(20, 155, 220);
        else accent = Color(30, 190, 80);
      }
      const Color dim(accent.r / 2, accent.g / 2, accent.b / 2);
      static constexpr int ARC_POINTS[][2] = {
        {20,63},{22,59},{25,56},{27,52},{29,49},{32,46},{35,43},{37,40},
        {40,37},{43,35},{46,32},{49,29},{52,27},{56,25},{59,22},{63,20},
        {66,18},{70,17},{73,15},{77,13},{81,12},{84,11},
        {156,11},{159,12},{163,13},{167,15},{170,17},{174,18},{178,20},
        {181,22},{184,25},{188,27},{191,29},{194,32},{197,35},{200,37},
        {203,40},{205,43},{208,46},{211,49},{213,52},{215,56},{218,59},{220,63},
        {220,177},{218,181},{215,184},{213,188},{211,191},{208,194},{205,197},
        {203,200},{200,203},{197,205},{194,208},{191,211},{188,213},{184,215},
        {181,218},{178,220},{174,222},{170,223},{167,225},{163,227},{159,228},
        {156,229},{84,229},{81,228},{77,227},{73,225},{70,223},{66,222},
        {63,220},{59,218},{56,215},{52,213},{49,211},{46,208},{43,205},
        {40,203},{37,200},{35,197},{32,194},{29,191},{27,188},{25,184},
        {22,181},{20,177}
      };

      auto rounded_box = [&](int x, int y, int width, int height,
                             int radius, Color color) {
        if (radius <= 0) {
          it.filled_rectangle(x, y, width, height, color);
          return;
        }
        it.filled_rectangle(x + radius, y, width - 2 * radius, height, color);
        it.filled_rectangle(x, y + radius, width, height - 2 * radius, color);
        it.filled_circle(x + radius, y + radius, radius, color);
        it.filled_circle(x + width - radius - 1, y + radius, radius, color);
        it.filled_circle(x + radius, y + height - radius - 1, radius, color);
        it.filled_circle(x + width - radius - 1,
                         y + height - radius - 1, radius, color);
      };

      it.fill(Color::BLACK);
      it.circle(120, 120, 115, dim);
      for (const auto &point : ARC_POINTS)
        it.filled_circle(point[0], point[1], 3, accent);

      it.print(120, 71, id(title_font), accent,
               TextAlign::BASELINE_CENTER, "${page_label}");

      constexpr int BX = 8, BY = 83, BW = 220, BH = 73, RIM = 3;
      constexpr int IX = BX + RIM, IY = BY + RIM;
      constexpr int IW = BW - 2 * RIM, IH = BH - 2 * RIM;
      const Color empty(48, 48, 48);
      const Color outline = value_ok ? accent : Color(109, 109, 85);

      rounded_box(227, 107, 10, 26, 2, outline);
      rounded_box(BX, BY, BW, BH, 10, outline);
      rounded_box(IX, IY, IW, IH, 7, empty);

      if (value_ok) {
        int fill_width = static_cast<int>(lroundf(value * IW / 100.0f));
        fill_width = std::max(0, std::min(IW, fill_width));
        if (fill_width > 0) {
          it.start_clipping(display::Rect(IX, IY, fill_width, IH));
          rounded_box(IX, IY, IW, IH, 7, accent);
          it.end_clipping();
        }
      }

      char value_text[16];
      if (value_ok)
        snprintf(value_text, sizeof(value_text), "%.0f%%", value);
      else
        snprintf(value_text, sizeof(value_text), "--%%");

      const int value_baseline = 120 + id(temp_font)->get_capheight() / 2;
      constexpr int OUTLINE_QUALITY = ${battery_outline_quality};
      static constexpr int CARDINAL[][2] =
          {{-2,0},{2,0},{0,-2},{0,2}};
      static constexpr int DIAGONAL[][2] =
          {{-2,-2},{-2,2},{2,-2},{2,2}};
      for (const auto &offset : CARDINAL)
        it.print(120 + offset[0], value_baseline + offset[1],
                 id(temp_font), Color::BLACK,
                 TextAlign::BASELINE_CENTER, value_text);
      if constexpr (OUTLINE_QUALITY == 2) {
        for (const auto &offset : DIAGONAL)
          it.print(120 + offset[0], value_baseline + offset[1],
                   id(temp_font), Color::BLACK,
                   TextAlign::BASELINE_CENTER, value_text);
      }
      it.print(120, value_baseline, id(temp_font), Color::WHITE,
               TextAlign::BASELINE_CENTER, value_text);

      it.graph(33, 156, id(rotation_graph_${page_id}));

      auto now = id(sntp_time).now();
      char time_text[16];
      if (now.is_valid()) {
        int hour12 = now.hour % 12;
        if (hour12 == 0) hour12 = 12;
        snprintf(time_text, sizeof(time_text), "%d:%02d %s",
                 hour12, now.minute, now.hour >= 12 ? "PM" : "AM");
      } else {
        snprintf(time_text, sizeof(time_text), "--:--");
      }
      it.print(120, 189 + id(time_font)->get_capheight() / 2,
               id(time_font), Color::WHITE,
               TextAlign::BASELINE_CENTER, time_text);

      const int count = static_cast<int>(id(rotation_pages).size());
      const int active = static_cast<int>(id(rotation_visible_index));
      if (count > 0) {
        const int step = count <= 13 ? 14 :
            std::max(2, 168 / std::max(1, count - 1));
        const int start_x = 120 - (step * (count - 1)) / 2;
        for (int i = 0; i < count; i++) {
          const int x = start_x + i * step;
          if (i == active) {
            it.filled_circle(x, 221, 7, Color::BLACK);
            it.filled_ring(x, 221, 6, 5, accent);
            it.filled_circle(x, 221, 3, Color::WHITE);
          } else {
            it.filled_circle(x, 221, 2, Color(64, 64, 85));
          }
        }
      }
