# COPY LOCALLY. Demonstrates template-driven rotation with no legacy slot limit.
substitutions:
  device_name: round-minion-template-example
  friendly_name: Round Minion Template Example
  timezone: Etc/UTC
  ha_base_url: http://homeassistant.local:8123
  clock_page_duration_ms: '4000'


packages:
  round_minion:
    url: https://github.com/PhiKapJames/ESPHome-1.28-Round-LCD-Display
    ref: main  # Development; pin a tested tag or commit SHA on deployed devices.
    files:
      - profiles/esp32-s3-quad-psram-camera.yaml

      - path: packages/page-numeric.yaml
        vars:
          page_id: kitchen
          page_label: Kitchen
          page_entity: sensor.example_kitchen_temperature
          page_duration_ms: '4000'
          page_order: '10'
          page_unit: °F
          page_suffix: °
          page_decimals: '1'
          page_panel_style: '1'
          page_color_red: 0%
          page_color_green: 62%
          page_color_blue: 45%

      - path: packages/page-numeric.yaml
        vars:
          page_id: outside
          page_label: Outside
          page_entity: sensor.example_outside_temperature
          page_duration_ms: '4000'
          page_order: '20'
          page_unit: °F
          page_suffix: °
          page_decimals: '1'
          page_panel_style: '1'
          page_color_red: 33.7%
          page_color_green: 70.6%
          page_color_blue: 91.4%

      # Example schedule-only page. Home Assistant / Node-RED can turn its
      # generated "Commute Screen" switch on only during the commute window.
      - path: packages/page-numeric.yaml
        vars:
          page_id: commute
          page_label: Commute
          page_entity: sensor.example_commute_minutes
          page_duration_ms: '4000'
          page_order: '30'
          page_enabled_restore_mode: RESTORE_DEFAULT_OFF
          page_value_font: number_font_compact
          page_unit: min
          page_suffix: ' min'
          page_decimals: '0'
          page_panel_style: '1'
          page_color_red: 100%
          page_color_green: 55%
          page_color_blue: 0%

      - path: packages/page-battery.yaml
        vars:
          page_id: house_battery
          page_label: Battery
          page_entity: sensor.example_battery
          page_duration_ms: '4000'
          page_order: '40'
      # Optional: deliberately place a camera view into normal rotation.
      # This requires a *-camera profile because it reuses camera_http.
      - path: packages/page-camera.yaml
        vars:
          page_id: driveway_view
          page_label: DRIVEWAY
          page_entity: camera.example_driveway
          page_duration_ms: '5000'
          page_order: '50'

    refresh: 1d

api:
  encryption:
    key: !secret api_encryption_key

ota:
- platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
