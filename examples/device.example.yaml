# COPY LOCALLY; replace placeholders and keep actual mappings outside this repository.
substitutions:
  device_name: round-minion-example
  friendly_name: Round Minion Example
  timezone: Etc/UTC
  clock_page_duration_ms: '8000'
  clock_face_style: original

packages:
  round_minion:
    url: https://github.com/PhiKapJames/ESPHome-1.28-Round-LCD-Display
    ref: main  # Development; pin a tested tag or commit SHA on deployed devices.
    files:
      - profiles/esp32-c3-camera.yaml

      - path: packages/page-numeric.yaml
        vars:
          page_id: room
          page_label: Room
          page_entity: sensor.example_metric_1
          page_duration_ms: '8000'
          page_order: '10'
          page_unit: °F
          page_suffix: °
          page_decimals: '1'
          page_panel_style: '1'
          page_color_red: 33.7%
          page_color_green: 70.6%
          page_color_blue: 91.4%

      - path: packages/camera-source.yaml
        vars:
          camera_id: example
          camera_entity: camera.example_camera
          camera_source_label: CAMERA
          camera_status_label: camera
          camera_button_name: Show Camera Snapshot
          camera_trigger_person: 'true'
          camera_person_entity: binary_sensor.example_person
          camera_trigger_vehicle: 'false'
          camera_vehicle_entity: binary_sensor.example_vehicle
          camera_cooldown_ms: '60000'
    refresh: 1d

api:
  encryption:
    key: !secret api_encryption_key

ota:
- platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5
