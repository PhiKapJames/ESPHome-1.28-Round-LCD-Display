# COPY LOCALLY; replace placeholders and keep actual mappings outside this repository.
substitutions:
  device_name: round-minion-example
  friendly_name: Round Minion Example
  timezone: Etc/UTC
  ha_base_url: http://homeassistant.local:8123

  metric_1_label: Room 1
  metric_1_entity: sensor.example_metric_1
  metric_1_enabled: 'true'
  metric_2_label: Room 2
  metric_2_entity: sensor.example_metric_2
  metric_2_enabled: 'true'
  metric_3_label: Room 3
  metric_3_entity: sensor.example_metric_3
  metric_3_enabled: 'true'
  metric_4_label: Room 4
  metric_4_entity: sensor.example_metric_4
  metric_4_enabled: 'true'
  metric_5_label: Room 5
  metric_5_entity: sensor.example_metric_5
  metric_5_enabled: 'true'
  metric_6_label: Battery
  metric_6_entity: sensor.example_metric_6
  metric_6_enabled: 'true'

packages:
  round_minion:
    url: https://github.com/PhiKapJames/HaEspRoundMinions
    ref: main  # Pin a tested commit SHA in deployed device files.
    files:
      - profiles/esp32-c3-camera.yaml
      - path: packages/camera-source.yaml
        vars:
          camera_id: example
          camera_entity: camera.example_camera
          camera_source_label: CAMERA
          camera_status_label: camera
          camera_button_name: Show Camera Snapshot
          camera_trigger_person: 'true'
          camera_person_entity: binary_sensor.example_person
          camera_trigger_vehicle: 'false'
          camera_vehicle_entity: binary_sensor.example_vehicle
          camera_cooldown_ms: '60000'
    refresh: 1d

api:
  encryption:
    key: !secret 'api_encryption_key'

ota:
- platform: esphome
  password: !secret 'ota_password'

wifi:
  ssid: !secret 'wifi_ssid'
  password: !secret 'wifi_password'
  output_power: 8.5
