# COPY LOCALLY. Add as many page and camera-source entries as this device needs.
# Replace placeholders and keep real Home Assistant mappings private.
substitutions:
  device_name: round-minion-multi-camera-example
  friendly_name: Round Minion Multi Camera Example
  timezone: Etc/UTC
  ha_base_url: http://homeassistant.local:8123
  clock_page_duration_ms: '4000'

packages:
  round_minion:
    url: https://github.com/PhiKapJames/HaEspRoundMinions
    ref: main
    files:
      - profiles/esp32-c3-camera.yaml

      - path: packages/page-numeric.yaml
        vars:
          page_id: room
          page_label: Room
          page_entity: sensor.example_metric_1
          page_duration_ms: '4000'
          page_order: '10'
          page_unit: °F
          page_suffix: °
          page_decimals: '1'
          page_panel_style: '1'
          page_color_red: 33.7%
          page_color_green: 70.6%
          page_color_blue: 91.4%

      - path: packages/camera-source.yaml
        vars:
          camera_id: driveway
          camera_entity: camera.example_driveway
          camera_source_label: DRIVEWAY
          camera_status_label: driveway
          camera_button_name: Show Driveway Snapshot
          camera_trigger_person: 'true'
          camera_person_entity: binary_sensor.example_driveway_person
          camera_trigger_vehicle: 'true'
          camera_vehicle_entity: binary_sensor.example_driveway_vehicle
          camera_cooldown_ms: '60000'

      - path: packages/camera-source.yaml
        vars:
          camera_id: garage
          camera_entity: camera.example_garage
          camera_source_label: GARAGE
          camera_status_label: garage
          camera_button_name: Show Garage Snapshot
          camera_trigger_person: 'true'
          camera_person_entity: binary_sensor.example_garage_person
          camera_trigger_vehicle: 'false'
          camera_vehicle_entity: binary_sensor.example_garage_vehicle
          camera_cooldown_ms: '60000'
    refresh: 1d

api:
  encryption:
    key: !secret api_encryption_key

ota:
- platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
