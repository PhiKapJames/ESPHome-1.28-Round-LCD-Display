# COPY LOCALLY. Replace placeholders; never commit your real Home Assistant entities,
# network addresses, or secrets to the public repository.
substitutions:
  device_name: round-minion-multi-camera-example
  friendly_name: Round Minion Multi Camera Example
  timezone: Etc/UTC
  ha_base_url: http://homeassistant.local:8123

  # Camera 1: person OR vehicle. A one-lens or selected multi-lens camera entity works.
  camera_1_enabled: 'true'
  camera_1_entity: camera.example_driveway
  camera_1_source_label: DRIVEWAY
  camera_1_status_label: driveway
  camera_1_button_name: Show Driveway Snapshot
  camera_1_trigger_person: 'true'
  camera_1_person_entity: binary_sensor.example_driveway_person
  camera_1_trigger_vehicle: 'true'
  camera_1_vehicle_entity: binary_sensor.example_driveway_vehicle

  # Camera 2: vehicle only.
  camera_2_enabled: 'true'
  camera_2_entity: camera.example_parking
  camera_2_source_label: PARKING
  camera_2_status_label: parking
  camera_2_button_name: Show Parking Snapshot
  camera_2_trigger_person: 'false'
  camera_2_trigger_vehicle: 'true'
  camera_2_vehicle_entity: binary_sensor.example_parking_vehicle

  # Camera 3/4 stay disabled unless this local device needs them.
  camera_3_enabled: 'false'
  camera_4_enabled: 'false'

  metric_1_label: Room
  metric_1_entity: sensor.example_metric_1
  metric_1_enabled: 'true'
  metric_2_enabled: 'false'
  metric_3_enabled: 'false'
  metric_4_enabled: 'false'
  metric_5_enabled: 'false'
  metric_6_enabled: 'false'

packages:
  round_minion:
    url: https://github.com/PhiKapJames/HaEspRoundMinions
    ref: main
    files:
    - profiles/esp32-c3-camera.yaml
    refresh: 1d

api:
  encryption:
    key: !secret 'api_encryption_key'

ota:
- platform: esphome
  password: !secret 'ota_password'

wifi:
  ssid: !secret 'wifi_ssid'
  password: !secret 'wifi_password'
